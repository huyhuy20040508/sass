# Web bán hàng (ecommerce_web) — bản ĐÃ có chứng chỉ selliotech-web.
# Chứng chỉ không phải wildcard: mỗi shop mới phải thêm địa chỉ vào chứng chỉ,
# việc đó do `selliotech-web-them-shop` làm.
server {
    listen 80;
    listen [::]:80;
    server_name web.selliotech.store *.web.selliotech.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 trên máy chủ chưa có lệnh `http2 on;` (từ 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web.selliotech.store *.web.selliotech.store;

    ssl_certificate     /etc/letsencrypt/live/selliotech-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/selliotech-web/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/selliotech-web-ban.conf;
}
