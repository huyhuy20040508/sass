# Phần chung của web bán hàng (ecommerce_web) cho cả bản HTTP lẫn HTTPS.
# 05-web-ban.sh chép tệp này thành /etc/nginx/snippets/selliotech-web-ban.conf.

root /var/www/selliotech/ecommerce_web/frontend/dist;
index index.html;
charset utf-8;

access_log /var/log/nginx/web.selliotech.store.access.log;
error_log  /var/log/nginx/web.selliotech.store.error.log;

# Mọi /api/* vào đúng một tệp PHP; không location nào khác chạy PHP, nên không
# đường nào gọi thẳng được tệp trong backend/src. Shop nhận theo Host (fastcgi_params
# chuyển HTTP_HOST), nên một khối server phục vụ được mọi shop.
location /api/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.3-fpm-selliotech.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/selliotech/ecommerce_web/backend/public/index.php;
    fastcgi_read_timeout 60s;
    client_max_body_size 6m;
}

# Tệp build có băm tên nên lưu cache lâu được; index.html thì không.
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# Đường dẫn của React Router (/admin, /admin/dang-nhap…) đều trả index.html.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
}

location ~ /\.(?!well-known).* { deny all; }
