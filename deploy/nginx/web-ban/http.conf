# Web bán hàng (ecommerce_web) — bản CHƯA có chứng chỉ. Mỗi shop một địa chỉ
# <mã>.web.selliotech.store; 05-web-ban.sh dùng tệp này khi chưa có
# /etc/letsencrypt/live/selliotech-web, có rồi thì dùng https.conf.
server {
    listen 80;
    listen [::]:80;
    server_name web.selliotech.store *.web.selliotech.store;

    # Let's Encrypt xác minh qua thư mục này (certbot --webroot), không qua
    # plugin nginx: plugin đó tự sửa tệp cấu hình, mà tệp này bị chép đè mỗi lượt triển khai.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    include snippets/selliotech-web-ban.conf;
}
