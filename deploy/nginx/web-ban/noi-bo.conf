# Cổng NỘI BỘ cho Next.js gọi API PHP từ phía máy chủ, giữ nguyên Host của shop.
# Chỉ nghe 127.0.0.1 — từ ngoài không tới được. (Bản dev huyweb dùng 8098, prod 8099:
# hai bản chạy chung một máy.)
server {
    listen 127.0.0.1:8099;
    server_name _;

    location /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm-selliotech.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/selliotech/ecommerce_web/backend/public/index.php;
    }

    location / { return 404; }
}
