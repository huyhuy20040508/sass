# api.selliotech.store — Go API (chạy nội bộ ở 127.0.0.1:8090)
#
# 8090 chứ không phải 8080 mặc định: 8080 là cổng ai cũng chọn, và máy chủ này
# đã có sẵn hai Go API khác của dự án cũ giữ 8080 với 8081. Đặt trùng thì
# systemd khởi động không lên với "bind: address already in use", trong khi
# nginx vẫn trả lời bình thường bằng ứng dụng của dự án kia — nhìn bề ngoài
# thấy web chạy, thực ra đang chạy nhầm chương trình.
#
# Đổi cổng thì phải đổi CẢ BA chỗ: APP_PORT trong api/.env, hai dòng proxy_pass
# bên dưới, và API_BASE_URL trong web_Shop/.env lẫn admin-Selliotech/.env.
#
# Đặt tại: /etc/nginx/sites-available/api.selliotech.store
# Bật:     ln -s /etc/nginx/sites-available/api.selliotech.store /etc/nginx/sites-enabled/
#
# Tệp này CHỈ khai cổng 80. Phần HTTPS do certbot tự chèn vào khi chạy
# `certbot --nginx`; đừng viết tay để lần gia hạn sau nó không phải đoán.

server {
    listen 80;
    listen [::]:80;
    server_name api.selliotech.store;

    # Go API không nhận tệp tải lên (ảnh đi qua Shop Admin), nên để chặt.
    client_max_body_size 2M;

    access_log /var/log/nginx/api.selliotech.store.access.log;
    error_log  /var/log/nginx/api.selliotech.store.error.log;

    # ---- Luồng realtime (SSE) -------------------------------------------
    #
    # Phải tách riêng khỏi location / bên dưới. Mặc định nginx GOM đệm phản hồi
    # rồi mới trả về, nghĩa là mọi sự kiện nằm im trong bộ đệm cho tới khi kết
    # nối đóng — trang quản trị sẽ không bao giờ thấy đơn mới hiện lên.
    #
    # proxy_read_timeout cũng phải nới: kết nối SSE cố tình mở lâu, để mặc định
    # 60 giây là cứ mỗi phút trình duyệt lại bị ngắt và nối lại một lần.
    location /api/v1/events {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
