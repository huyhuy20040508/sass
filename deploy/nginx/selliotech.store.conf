# selliotech.store — trang giới thiệu phần mềm (tĩnh, không PHP)
#
# Đặt tại: /etc/nginx/sites-available/selliotech.store
# Bật:     ln -s /etc/nginx/sites-available/selliotech.store /etc/nginx/sites-enabled/
#
# Tệp này CHỈ khai cổng 80. Phần HTTPS do certbot tự chèn vào — xem ghi chú ở
# api.selliotech.store.conf.

server {
    listen 80;
    listen [::]:80;

    # Nhận CẢ HAI tên, không chuyển hướng www về gốc.
    #
    # Chuyển hướng ở tầng nginx sẽ đá vào lúc certbot xin chứng chỉ: Let's
    # Encrypt gọi http://www.selliotech.store/.well-known/... để xác minh, mà
    # lúc đó đích chuyển hướng (https://selliotech.store) chưa có chứng chỉ nào
    # để nói chuyện. Việc gom hai tên về một địa chỉ chuẩn để công cụ tìm kiếm
    # khỏi coi là hai trang trùng nhau đã có thẻ <link rel="canonical"> trong
    # index.html lo — không cần nginx nhúng tay.
    server_name selliotech.store www.selliotech.store;

    root /var/www/selliotech/landing;
    index index.html;

    charset utf-8;

    access_log /var/log/nginx/selliotech.store.access.log;
    error_log  /var/log/nginx/selliotech.store.error.log;

    # Nén trước khi gửi. nginx của Ubuntu bật sẵn `gzip on` nhưng danh sách kiểu
    # tệp để mặc định chỉ có text/html, nên css/js/svg vẫn đi nguyên khổ —
    # riêng logo SVG đã hơn 8 KB.
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;
    gzip_vary on;

    # Hai header này khai Ở ĐÂY và chỉ ở đây.
    #
    # nginx chỉ kế thừa add_header xuống location nào KHÔNG tự khai add_header
    # của riêng nó — thêm một dòng add_header vào location bên dưới là lặng lẽ
    # đánh rơi cả hai dòng này ở đúng những trang cần chúng nhất. Vì vậy phần
    # hạn dùng bộ nhớ đệm bên dưới dùng `expires`, không dùng `add_header`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Mặc định: luôn hỏi lại máy chủ. Áp cho trang HTML.
    #
    # Phải đặt ở mức server chứ không phải trong một location bắt `\.html$`:
    # người ta vào bằng địa chỉ `/`, nginx chọn location theo URI gốc đó rồi mới
    # nhờ index đọc index.html — location bắt đuôi .html sẽ không bao giờ khớp
    # với chính trang chủ.
    expires -1;

    location / {
        try_files $uri $uri/ =404;
    }

    # Ảnh, css, js: giữ một giờ, KHÔNG giữ lâu hơn.
    #
    # Tên tệp ở đây cố định (styles.css chứ không phải styles.a1b2c3.css), nên
    # đặt hạn dài là người đã vào trang một lần sẽ ôm bản cũ tới lúc hết hạn,
    # sửa xong đẩy lên mà họ không thấy gì đổi. Một giờ đủ nhẹ cho máy chủ mà
    # nội dung sửa vẫn tới nơi trong ngày.
    location ~* \.(css|js|svg|png|jpe?g|webp|woff2)$ {
        expires 1h;
        access_log off;
    }

    # Trình duyệt nào cũng tự mò /favicon.ico dù trang đã khai favicon SVG.
    # Không có tệp đó thật, tắt log cho khỏi rác.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Chặn tệp ẩn (.git...), trừ .well-known mà certbot cần để xác thực.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
