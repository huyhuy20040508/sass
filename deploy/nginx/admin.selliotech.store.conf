# admin.selliotech.store — Shop Admin (Laravel, khu quản lý bán hàng)
#
# Đặt tại: /etc/nginx/sites-available/admin.selliotech.store
# Bật:     ln -s /etc/nginx/sites-available/admin.selliotech.store /etc/nginx/sites-enabled/
#
# Phần HTTPS do certbot chèn vào — xem ghi chú ở api.selliotech.store.conf.

server {
    listen 80;
    listen [::]:80;
    server_name admin.selliotech.store;

    root /var/www/selliotech/admin/public;
    index index.php;

    charset utf-8;

    # ImageStore nhận ảnh tới 10MB (ảnh chụp điện thoại thường 3–8MB) rồi mới
    # thu nhỏ. Để 12M cho dư phần bao thư multipart; đặt bằng đúng 10M là ảnh
    # sát trần bị nginx chặn trước khi PHP kịp nhìn thấy, và người bán chỉ nhận
    # được lỗi 413 trống trơn.
    #
    # Phải khớp với upload_max_filesize / post_max_size của PHP — xem
    # deploy/scripts/01-cai-may-chu.sh.
    client_max_body_size 12M;

    access_log /var/log/nginx/admin.selliotech.store.access.log;
    error_log  /var/log/nginx/admin.selliotech.store.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Ảnh sản phẩm / logo do người bán tải lên (qua symlink public/storage).
    # Cache dài vì tên tệp do ImageStore sinh ngẫu nhiên, sửa ảnh là ra tên mới.
    location ^~ /storage/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Báo cáo doanh thu theo khoảng dài phải gọi API rồi tổng hợp, chậm hơn
        # trang thường; 60s mặc định đủ nhưng để rõ ràng ở đây.
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
