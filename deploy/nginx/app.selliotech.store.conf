# app.selliotech.store — SaaS Admin (Laravel, khu điều hành nền tảng)
#
# Đặt tại: /etc/nginx/sites-available/app.selliotech.store
# Bật:     ln -s /etc/nginx/sites-available/app.selliotech.store /etc/nginx/sites-enabled/
#
# Phần HTTPS do certbot chèn vào — xem ghi chú ở api.selliotech.store.conf.

server {
    listen 80;
    listen [::]:80;
    server_name app.selliotech.store;

    # `public` chứ không phải thư mục gốc của app: mọi thứ ngoài public (kể cả
    # .env) phải nằm ngoài tầm với của web server.
    root /var/www/selliotech/saas/public;
    index index.php;

    charset utf-8;

    # Khu điều hành chưa có chỗ nào tải tệp lên; nới ra khi nào cần.
    client_max_body_size 4M;

    access_log /var/log/nginx/app.selliotech.store.access.log;
    error_log  /var/log/nginx/app.selliotech.store.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-selliotech.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Chặn tệp ẩn (.env, .git...), trừ .well-known mà certbot cần để xác thực.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
