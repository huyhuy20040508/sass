# app.selliotech.store — TÊN MIỀN CŨ, chỉ còn chuyển hướng
#
# Khu điều hành nền tảng từng nằm ở đây, nay dời sang admin.selliotech.store.
# Giữ tệp này thay vì xoá hẳn tên miền vì hai lý do:
#
#   1. Người đã lưu dấu trang (và mấy tab đang mở sẵn trên máy) vẫn tới đúng
#      chỗ, thay vì nhận một trang lỗi không nói được gì.
#   2. Tên miền còn nằm trong chứng chỉ TLS. Bỏ nó khỏi nginx mà vẫn còn trong
#      DNS thì trình duyệt gõ vào đây sẽ rơi vào server block mặc định — tuỳ
#      máy mà ra trang của tên miền khác, khó hiểu hơn hẳn một cú chuyển hướng.
#
# 301 (vĩnh viễn) chứ không phải 302: địa chỉ này không quay lại nữa, và 301 để
# trình duyệt nhớ luôn, đỡ một vòng mạng cho mỗi lần mở sau.
#
# Đặt tại: /etc/nginx/sites-available/app.selliotech.store
# Bật:     ln -s /etc/nginx/sites-available/app.selliotech.store /etc/nginx/sites-enabled/
#
# Phần HTTPS do certbot chèn vào — xem ghi chú ở api.selliotech.store.conf.

server {
    listen 80;
    listen [::]:80;
    server_name app.selliotech.store;

    access_log /var/log/nginx/app.selliotech.store.access.log;
    error_log  /var/log/nginx/app.selliotech.store.error.log;

    # Chừa đường cho certbot gia hạn chứng chỉ: xác thực HTTP-01 gọi vào
    # /.well-known/acme-challenge/ trên cổng 80, chuyển hướng luôn cả nó thì
    # lượt gia hạn nào cũng trượt.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Giữ nguyên phần đường dẫn: /dashboard cũ vẫn ra /dashboard mới.
    location / {
        return 301 https://admin.selliotech.store$request_uri;
    }
}
