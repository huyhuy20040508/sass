; Pool PHP-FPM riêng cho Selliotech.
;
; Đặt tại: /etc/php/8.3/fpm/pool.d/selliotech.conf
; Nạp:     systemctl reload php8.3-fpm
;
; TẠI SAO KHÔNG DÙNG POOL MẶC ĐỊNH (www.conf):
;
; Máy chủ có thể đang chạy dự án khác, và dự án đó có toàn quyền sửa www.conf.
; Trên VPS hiện tại nó đã đổi `user` của pool mặc định sang `football`. PHP chạy
; dưới tên người dùng ấy thì không ghi nổi vào storage/ của Selliotech, và biểu
; hiện là mọi trang trả 500 — nhưng KHÔNG có dòng log nào, vì thứ hỏng chính là
; cái ghi log. Chạy cùng mã đó bằng CLI lại ra 200, nên rất dễ đi lạc hướng.
;
; Pool riêng cắt đứt phụ thuộc đó: hai dự án chạy dưới hai người dùng khác nhau,
; hai socket khác nhau, không đọc được tệp của nhau.

[selliotech]

user = selliotech
group = selliotech

; Socket riêng — nginx của Selliotech trỏ vào đây, đừng dùng php8.3-fpm.sock chung.
listen = /run/php/php8.3-fpm-selliotech.sock
; nginx chạy dưới www-data nên nó phải mở được socket này.
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Máy chủ ~2GB RAM và còn phải chia cho dự án khác. Mỗi tiến trình PHP của
; Laravel ăn khoảng 40–60MB, nên 8 tiến trình là trần an toàn.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Tái sinh tiến trình định kỳ để rò rỉ bộ nhớ (nếu có) không tích lại vô hạn.
pm.max_requests = 500

; Log lỗi PHP của riêng pool này.
php_admin_value[error_log] = /var/log/php8.3-fpm-selliotech.log
php_admin_flag[log_errors] = on

; Giới hạn tải tệp — phải KHỚP client_max_body_size 12M bên nginx. Lệch nhau thì
; ảnh sát trần bị chặn ở một trong hai tầng và người bán chỉ nhận lỗi trống trơn.
;
; Đặt ở đây chứ không đặt trong conf.d/ dùng chung: sửa ở conf.d là đổi luôn giới
; hạn của dự án khác trên cùng máy.
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120

; Session của Laravel nằm ở tệp trong storage/, không dùng session của PHP.
php_admin_value[session.save_path] = /var/lib/php/sessions
