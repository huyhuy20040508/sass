      description: |-
        Ứng viên để KÝ HỢP ĐỒNG CHÍNH THỨC: cửa hàng đã tồn tại ở database bán
        hàng nhưng chưa có hợp đồng còn hiệu lực cho phần mềm này.
        Phép trừ làm ở tầng Go vì hai danh sách nằm ở hai database khác nhau —
        không câu truy vấn nào JOIN được chúng.
        "Còn hiệu lực" gồm cả `trial` và `past_due`, không riêng `active`: cả hai
        đều đang giữ chỗ của khoá "mỗi khách mỗi phần mềm một hợp đồng".
      parameters:
      - description: Mã phần mềm; bỏ trống = mọi phần mềm được giao
