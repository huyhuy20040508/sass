          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Cập nhật thanh toán cho nhà cung cấp
      tags:
      - Admin - Purchases
  /admin/purchases/{id}/receive:
    post:
      consumes:
      - application/json
      description: |-
        Ghi nhận MỘT đợt hàng về: cộng số đã nhận của từng dòng, CỘNG TỒN KHO của biến thể tương ứng và ghi bút toán sổ kho (`type=import`, `reference_type=purchase_order`) — tất cả trong cùng một transaction.
        Nhận nhiều đợt được (nhà cung cấp giao dần): phiếu tự chuyển sang "nhận một phần", và chỉ khi MỌI dòng đủ số thì mới thành "đã nhận đủ".
        Nhận vượt phần còn thiếu trả 422 và KHÔNG dòng nào được ghi — một đợt nhận hàng là một lần cân đối kho, ghi nửa chừng còn khó dọn hơn báo lỗi.
        `update_cost` (mặc định true) ghi luôn giá nhập của đợt này thành giá vốn của biến thể, để trang tồn kho tính giá trị kho theo giá vừa mua.
      parameters:
      - description: ID phiếu đặt hàng
        in: path
        name: id
        required: true
        type: integer
      - description: Số lượng nhận của từng dòng
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PurchaseReceiveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.PurchaseDetail'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Phiếu không ở giai đoạn nhận hàng được
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Nhận hàng cho phiếu đặt (nhập kho)
      tags:
      - Admin - Purchases
  /admin/purchases/{id}/status:
    put:
      consumes:
      - application/json
      description: |-
        Hai đích: `ordered` (gửi phiếu cho nhà cung cấp) và `cancelled` (huỷ phiếu). Mỗi lần chuyển đều được ghi vào lịch sử phiếu.
        KHÔNG có đường tay nào tới "đã nhận đủ": đánh dấu đã nhận mà không đi qua luồng nhận hàng là phiếu đóng xong mà kho không có hàng. Muốn đóng phiếu thì nhận nốt số còn lại qua `/admin/purchases/{id}/receive`.
        Khi huỷ, trường `note` là lý do huỷ và BẮT BUỘC phải có. Huỷ phiếu đã nhận một phần không rút hàng đã về ra khỏi kho — số hàng đó là có thật.
      parameters:
      - description: ID phiếu đặt hàng
        in: path
        name: id
        required: true
        type: integer
      - description: Trạng thái mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PurchaseStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.PurchaseDetail'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Chuyển trạng thái phiếu đặt hàng
      tags:
      - Admin - Purchases
  /admin/purchases/stats:
    get:
      consumes:
      - application/json
      description: Đếm phiếu theo trạng thái, kèm SỐ HÀNG ĐANG TRÊN ĐƯỜNG (phần còn
        thiếu của các phiếu đang chờ, không phải cả số đặt), giá trị lô hàng đó theo
        giá nhập, và công nợ còn phải trả nhà cung cấp.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/domain.PurchaseStats'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Thống kê đặt hàng nhập
      tags:
      - Admin - Purchases
  /admin/purchases/variants:
    get:
      consumes:
      - application/json
      description: Trả về BIẾN THỂ (size/màu) đang bán kèm tồn kho hiện tại và giá
        vốn đang khai — màn hình lập phiếu dùng giá vốn làm giá nhập gợi ý. Hàng sắp
        hết xếp lên đầu vì đó chính là thứ cần đặt thêm.
      parameters:
      - description: Tên sản phẩm / SKU biến thể / SKU sản phẩm
        in: query
        name: keyword
        type: string
      - description: Số dòng tối đa (mặc định 20, tối đa 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.PurchaseVariant'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Tìm sản phẩm để đưa vào phiếu đặt hàng
      tags:
      - Admin - Purchases
  /admin/receipts:
    get:
      consumes:
      - application/json
      description: |-
        Liệt kê các ĐỢT hàng đã về kho theo phiếu đặt hàng nhập (mỗi lần bấm "Nhận hàng" là một đợt).
        Đợt nhập KHÔNG có bảng riêng: nó được dựng lại từ sổ kho (`inventory_transactions` với `type=import`, `reference_type=purchase_order`) bằng cách gom các bút toán cùng phiếu ghi sát nhau về thời gian. Nhờ vậy mọi đợt đã nhận từ trước đều hiện đủ.
        `code` là mã đợt dạng `<mã phiếu đặt>-N<đợt>` (VD: `PO202607300001-N2` là đợt nhận thứ hai của phiếu đó) — ổn định, dùng để tra cứu chi tiết.
        Đây là API CHỈ ĐỌC. Muốn nhập hàng thì gọi `POST /admin/purchases/{id}/receive` — chỗ duy nhất được cộng tồn kho.
      parameters:
      - description: Mã đợt / mã phiếu đặt / nhà cung cấp / người nhận / ghi chú
        in: query
        name: keyword
        type: string
      - description: Lọc theo nhà cung cấp
        in: query
        name: supplier_id
        type: integer
      - description: Từ ngày nhận (YYYY-MM-DD)
        in: query
        name: from_date
        type: string
      - description: Đến ngày nhận (YYYY-MM-DD)
        in: query
        name: to_date
        type: string
      - description: newest|oldest|qty_desc|amount_desc
        in: query
        name: sort
        type: string
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số item/trang (mặc định 20, tối đa 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.GoodsReceipt'
                  type: array
                meta:
                  $ref: '#/definitions/response.Pagination'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Danh sách đợt nhập hàng
      tags:
      - Admin - Goods Receipts
  /admin/receipts/{code}:
    get:
      consumes:
      - application/json
      description: 'Đọc một đợt nhập theo mã đợt (`<mã phiếu đặt>-N<đợt>`), kèm từng
        dòng hàng đã nhập: số lượng, giá nhập, thành tiền và tồn kho TRƯỚC/SAU khi
        nhập để đối chiếu lại với sổ kho.'
      parameters:
      - description: 'Mã đợt nhập, VD: PO202607300001-N1'
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/domain.GoodsReceipt'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Chi tiết đợt nhập hàng
      tags:
      - Admin - Goods Receipts
  /admin/receipts/stats:
    get:
      consumes:
      - application/json
      description: 'Tổng số đợt nhập / số lượng / giá trị đã nhập (theo giá nhập trên
        phiếu), phần nhập trong NGÀY HÔM NAY, kèm việc còn phải làm: số phiếu đã đặt
        mà hàng chưa về đủ và số lượng còn thiếu. Số liệu tính trên toàn bộ dữ liệu,
        không phụ thuộc bộ lọc đang áp.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/domain.GoodsReceiptStats'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Thống kê nhập hàng
      tags:
      - Admin - Goods Receipts
  /admin/reports/customers:
    get:
      consumes:
      - application/json
      description: |-
        Ai đang mua trong khoảng `from`–`to`: số khách mua, khách MỚI (lần mua đầu tiên rơi vào kỳ) và khách quay lại, số tài khoản đăng ký mới, cơ cấu hội viên / vãng lai, bảng xếp hạng chi tiêu và phân bố theo tỉnh thành.
        `buyers` chỉ đếm khách CÓ TÀI KHOẢN: đơn khách vãng lai không gắn `user_id` nên không có cách nào biết hai đơn có phải cùng một người. Phần vãng lai vẫn được đếm riêng ở `guest_orders` / `guest_revenue` để không biến mất khỏi báo cáo.
        `by_province` thì ngược lại — gộp theo địa chỉ nhận hàng nên tính CẢ đơn vãng lai, vì muốn biết nên mở rộng ở đâu thì phải nhìn hết người mua.
      parameters:
      - description: Ngày đầu kỳ (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Ngày cuối kỳ (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: Cách chia trục thời gian
        enum:
        - day
        - week
        - month
        in: query
        name: group_by
        type: string
      - description: Số dòng của bảng xếp hạng chi tiêu (mặc định 20, tối đa 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/domain.CustomerReport'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Báo cáo khách hàng
      tags:
      - Admin - Reports
  /admin/reports/orders:
    get:
      consumes:
      - application/json
      description: |-
        Đơn ra vào thế nào trong khoảng `from`–`to`: tổng đơn (KỂ CẢ huỷ/hoàn), phần còn hiệu lực, tỷ lệ huỷ, tiền chưa thu, cùng các lát cắt theo trạng thái / khung giờ / thứ trong tuần / tỉnh thành / kênh bán / hình thức vận chuyển.
        Khác báo cáo doanh thu ở mẫu số: `total` đếm MỌI đơn phát sinh trong kỳ, còn mọi con số tiền vẫn chỉ tính trên đơn còn hiệu lực. Tỷ lệ huỷ chỉ có nghĩa khi mẫu số là tổng đơn đã đặt.
        `by_status` luôn đủ 8 trạng thái, `by_hour` đủ 24 mốc (key = "0".."23"), `by_weekday` đủ 7 mốc (key = "1".."7", 1 = Thứ Hai) — kể cả khi bằng 0, để bảng không nhảy dòng giữa hai lần xem.
      parameters:
      - description: Ngày đầu kỳ (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Ngày cuối kỳ (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: Cách chia trục thời gian
        enum:
        - day
        - week
        - month
        in: query
        name: group_by
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/domain.OrderReport'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Báo cáo đơn hàng
      tags:
      - Admin - Reports
  /admin/reports/products:
    get:
      consumes:
      - application/json
      description: |-
        Mặt hàng nào kéo doanh thu trong khoảng `from`–`to`: bảng xếp hạng theo doanh thu / số lượng / lợi nhuận, cơ cấu theo danh mục, thương hiệu và size, kèm số sản phẩm đang bán mà cả kỳ không bán được món nào (`unsold_products`).
        `revenue` ở báo cáo này là tiền HÀNG (tổng `total_price` của các dòng đơn) nên KHÔNG bằng doanh thu ở báo cáo doanh thu: nó không gồm phí vận chuyển và chưa trừ giảm giá cấp đơn. Đây là chủ ý — xếp hạng mặt hàng thì không chia được phần giảm giá của cả đơn về từng dòng.
        Mỗi dòng kèm `stock` là tồn kho HIỆN TẠI (không phải tồn tại thời điểm bán) để thấy ngay mặt hàng bán chạy mà sắp hết hàng.
      parameters:
      - description: Ngày đầu kỳ (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Ngày cuối kỳ (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: Xếp hạng theo (mặc định revenue)
        enum:
        - revenue
        - units
        - profit
        in: query
        name: sort
        type: string
      - description: Số dòng của bảng xếp hạng (mặc định 20, tối đa 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/domain.ProductReport'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Báo cáo sản phẩm
      tags:
      - Admin - Reports
  /admin/reports/revenue:
    get:
      consumes:
      - application/json
      description: |-
        Tiền vào theo thời gian trong khoảng `from`–`to`: chuỗi theo mốc (ngày/tuần/tháng), tổng của kỳ và tổng của KỲ TRƯỚC cùng độ dài để tính mức tăng/giảm, kèm cơ cấu theo hình thức thanh toán và tình trạng thu tiền.
        Quy ước tính tiền giống trang Tổng quan: KHÔNG tính đơn huỷ và đơn hoàn hàng. Mốc thời gian của đơn là lúc đặt (`created_at`).
        `buckets` luôn ĐỦ mốc của cả kỳ — mốc không phát sinh đơn vẫn có mặt với giá trị 0, nếu thiếu thì biểu đồ nối thẳng qua và vẽ sai đường xu hướng.
        `profit` là lợi nhuận GỘP = `subtotal` − `discount` − `cost`: phí vận chuyển là tiền thu hộ nhà xe nên không tính là lãi. Sản phẩm chưa khai giá vốn được tính vốn bằng 0, khi đó lợi nhuận bằng đúng doanh thu.
      parameters:
      - description: Ngày đầu kỳ (YYYY-MM-DD), mặc định 30 ngày trước ngày cuối kỳ
        in: query
        name: from
        type: string
      - description: Ngày cuối kỳ (YYYY-MM-DD), mặc định hôm nay
        in: query
        name: to
        type: string
      - description: Cách chia trục thời gian; bỏ trống thì tự chọn theo độ dài kỳ
        enum:
        - day
        - week
        - month
        in: query
        name: group_by
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/domain.RevenueReport'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Báo cáo doanh thu
      tags:
      - Admin - Reports
  /admin/returns:
    get:
      consumes:
      - application/json
      description: 'Lọc theo từ khoá (mã phiếu / mã đơn / tên / SĐT người nhận), trạng
        thái phiếu, lý do trả, đơn hàng, khách hàng và khoảng ngày tạo; hỗ trợ sắp
        xếp và phân trang. Tham số `status` nhận NHIỀU trạng thái ngăn cách bởi dấu
        phẩy (VD: `pending,approved`) để lấy nhóm phiếu "đang xử lý".'
      parameters:
      - description: Mã phiếu / mã đơn / tên / SĐT người nhận
        in: query
        name: keyword
        type: string
      - description: all|pending|approved|received|refunded|rejected|cancelled — cho
          phép nhiều giá trị ngăn cách bởi dấu phẩy
        in: query
        name: status
        type: string
      - description: all|defective|wrong_item|wrong_size|not_as_described|changed_mind|other
        in: query
        name: reason
        type: string
      - description: Lọc phiếu của một đơn hàng
        in: query
        name: order_id
        type: integer
      - description: Lọc phiếu của một khách hàng
        in: query
        name: user_id
        type: integer
      - description: Từ ngày (YYYY-MM-DD)
        in: query
        name: from_date
        type: string
      - description: Đến ngày (YYYY-MM-DD)
