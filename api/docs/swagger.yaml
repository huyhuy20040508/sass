basePath: /api/v1
definitions:
  domain.ChiNhanh:
    properties:
      address:
        type: string
      code:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_active:
        description: |-
          IsActive = false: chi nhánh ngừng hoạt động nhưng dữ liệu cũ vẫn tra được.
          VẪN TÍNH vào hạn mức — nó còn giữ mã và còn đứng trong danh sách, y như tài
          khoản bị khoá vẫn chiếm một chỗ.
        type: boolean
      name:
        type: string
      phone:
        description: |-
          Phone/Address NULL được dưới database. Dùng StringOrNull để đọc NULL không
          vỡ ở tầng driver, và để ô bỏ trống ghi xuống NULL chứ không phải chuỗi rỗng.
        type: string
      updated_at:
        type: string
    type: object
  domain.CustomerBucket:
    properties:
      label:
        type: string
      new_buyers:
        type: integer
      registered:
        type: integer
      returning:
        type: integer
    type: object
  domain.CustomerReport:
    properties:
      buckets:
        items:
          $ref: '#/definitions/domain.CustomerBucket'
        type: array
      by_province:
        description: |-
          Khu vực tính theo địa chỉ nhận hàng của đơn, gồm CẢ đơn khách vãng lai —
          muốn biết nên mở rộng ở đâu thì phải nhìn hết người mua chứ không chỉ hội viên.
        items:
          $ref: '#/definitions/domain.ReportSlice'
        type: array
      from:
        type: string
      group_by:
        type: string
      prev:
        $ref: '#/definitions/domain.CustomerReportTotals'
      prev_from:
        type: string
      prev_to:
        type: string
      to:
        type: string
      top:
        items:
          $ref: '#/definitions/domain.CustomerReportRow'
        type: array
      totals:
        $ref: '#/definitions/domain.CustomerReportTotals'
    type: object
  domain.CustomerReportRow:
    properties:
      aov:
        type: number
      email:
        type: string
      is_new:
        description: IsNew = kỳ này là lần đầu khách mua hàng.
        type: boolean
      last_order_at:
        type: string
      name:
        type: string
      orders:
        type: integer
      phone:
        type: string
      revenue:
        type: number
      units:
        type: integer
      user_id:
        type: integer
    type: object
  domain.CustomerReportTotals:
    properties:
      buyers:
        type: integer
      guest_orders:
        type: integer
      guest_revenue:
        type: number
      member_orders:
        type: integer
      member_revenue:
        type: number
      new_buyers:
        description: lần mua ĐẦU TIÊN rơi vào kỳ này
        type: integer
      orders:
        type: integer
      orders_per_buyer:
        type: number
      registered:
        description: Registered là số tài khoản đăng ký mới trong kỳ, kể cả người
          chưa mua gì.
        type: integer
      repeat_rate:
        description: '% khách quay lại trên tổng khách có tài khoản đã mua'
        type: number
      returning:
        description: đã từng mua trước kỳ này
        type: integer
      revenue:
        type: number
      revenue_per_buyer:
        type: number
    type: object
  domain.CustomerStats:
    properties:
      active:
        type: integer
      inactive:
        type: integer
      total:
        type: integer
    type: object
  domain.GoodsReceipt:
    properties:
      amount:
        type: number
      batch:
        type: integer
      code:
        description: |-
          Code là mã đợt nhập: <mã phiếu đặt>-N<đợt>. Suy ra từ dữ liệu nên ổn định,
          in ra giấy đối chiếu được, và tự nói rõ đợt này thuộc phiếu nào.
        type: string
      created_by_name:
        type: string
      from_at:
        description: |-
          FromAt là mốc đóng của đợt TRƯỚC (rỗng nếu đây là đợt đầu). Cặp
          (FromAt, ReceivedAt] khoanh đúng các bút toán kho thuộc đợt này.
        type: string
      items:
        items:
          $ref: '#/definitions/domain.GoodsReceiptItem'
        type: array
      line_count:
        type: integer
      note:
        type: string
      po_code:
        type: string
      po_status:
        description: POStatus là trạng thái HIỆN TẠI của phiếu đặt (đã nhận đủ / nhận
          một phần).
        type: string
      purchase_order_id:
        type: integer
      quantity:
        type: integer
      received_at:
        description: ReceivedAt là lúc đợt nhận được ghi xong (mốc lịch sử của phiếu).
        type: string
      supplier_id:
        type: integer
      supplier_name:
        type: string
    type: object
  domain.GoodsReceiptItem:
    properties:
      amount:
        type: number
      color:
        type: string
      product_id:
        type: integer
      product_name:
        type: string
      quantity:
        type: integer
      quantity_after:
        type: integer
      quantity_before:
        type: integer
      size:
        type: string
      sku:
        type: string
      thumbnail:
        type: string
      transaction_id:
        type: integer
      unit_cost:
        type: number
      variant_id:
        type: integer
    type: object
  domain.GoodsReceiptStats:
    properties:
      pending_orders:
        description: 'Hai số dưới đây là việc CÒN PHẢI LÀM: phiếu đã đặt mà hàng chưa
          về đủ.'
        type: integer
      pending_quantity:
        type: integer
      today_quantity:
        type: integer
      today_receipts:
        type: integer
      total_amount:
        type: number
      total_quantity:
        type: integer
      total_receipts:
        type: integer
    type: object
  domain.InternalUserStats:
    properties:
      active:
        type: integer
      inactive:
        type: integer
      total:
        type: integer
    type: object
  domain.InventoryAdjustResult:
    properties:
      after:
        type: integer
      before:
        type: integer
      change:
        type: integer
      sku:
        type: string
      variant_id:
        type: integer
    type: object
  domain.InventoryHistory:
    properties:
      created_at:
        type: string
      created_by_name:
        type: string
      id:
        type: integer
      note:
        type: string
      quantity:
        type: integer
      quantity_after:
        type: integer
      quantity_before:
        type: integer
      reference_code:
        type: string
      reference_id:
        type: integer
      reference_type:
        type: string
      type:
        type: string
      unit_cost:
        type: number
    type: object
  domain.InventoryItem:
    properties:
      brand_name:
        type: string
      category_name:
        type: string
      color:
        type: string
      cost_price:
        description: |-
          CostPrice là giá VỐN hiệu lực: giá vốn riêng của biến thể nếu có, không thì
          của sản phẩm cha. nil = CHƯA KHAI giá vốn (khác với giá vốn bằng 0).
        type: number
      is_active:
        type: boolean
      kit_type:
        description: |-
          KitType là loại áo của sản phẩm cha (fan | player), lấy sẵn để giao diện
          kho phân biệt được FAN với PLAYER mà không phải gọi thêm.
        type: string
      last_moved_at:
        description: LastMovedAt là lần cuối biến thể này có bút toán kho (nil = chưa
          từng).
        type: string
      price:
        description: |-
          Price là giá HIỆU LỰC của biến thể: giá riêng của biến thể nếu có, không thì
          giá khuyến mãi, không nữa thì giá gốc của sản phẩm.
        type: number
      product_active:
        description: 'ProductActive = false: sản phẩm cha đang ẩn, hàng trong kho
          không bán được.'
        type: boolean
      product_id:
        type: integer
      product_name:
        type: string
      size:
        type: string
      sku:
        type: string
      slug:
        type: string
      stock_quantity:
        type: integer
      stock_value:
        description: |-
          StockValue = CostPrice * StockQuantity — giá trị hàng đang nằm trong kho,
          tính theo GIÁ VỐN đúng như kế toán yêu cầu. Biến thể chưa khai giá vốn cho
          0₫ ở đây; xem InventoryStats.MissingCost để biết tổng đang thiếu bao nhiêu dòng.
        type: number
      thumbnail:
        type: string
      variant_id:
        type: integer
    type: object
  domain.InventoryStats:
    properties:
      in_stock:
        type: integer
      low_stock:
        type: integer
      missing_cost:
        description: |-
          MissingCost là số biến thể chưa khai giá vốn, TÍNH CẢ hàng đang hết. Đây là
          con số cần hành động: hàng hôm nay tồn 0 mai nhập về vẫn sẽ đóng góp 0₫ nếu
          không ai khai giá vốn cho nó.
        type: integer
      missing_cost_in_stock:
        description: |-
          MissingCostInStock là phần trong số trên mà ĐANG CÒN HÀNG — đúng những dòng
          làm StockValue bị hụt ngay lúc này.
        type: integer
      out_of_stock:
        type: integer
      stock_value:
        description: StockValue là tổng giá trị kho theo GIÁ VỐN.
        type: number
      total_quantity:
        type: integer
      total_variants:
        type: integer
    type: object
  domain.NewsletterSubscriber:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      source:
        type: string
      unsubscribed_at:
        type: string
      updated_at:
        type: string
    type: object
  domain.Order:
    properties:
      admin_note:
        type: string
      amount_tendered:
        description: |-
          AmountTendered / ChangeAmount là tiền khách đưa và tiền thối lại tại quầy.
          nil = không thu bằng tiền mặt; 0 = có thu và khách đưa vừa đủ. Hai chuyện
          khác nhau, nên không dùng float64 với giá trị 0 cho cả hai.
        type: number
      cancel_reason:
        type: string
      cancelled_at:
        type: string
      change_amount:
        type: number
      channel:
        description: |-
          Channel là NƠI đơn phát sinh: OrderChannelWeb (đơn có giao hàng — khách tự
          đặt hoặc nhân viên đặt hộ) hoặc OrderChannelPOS (bán tại quầy). Đơn quầy
          không có địa chỉ giao, sinh ra đã hoàn tất và đã thu tiền.

          default:web không thừa dù mọi đường tạo đơn đều tự khai: cột là ENUM NOT
          NULL, nên đường nào quên khai sẽ ghi chuỗi rỗng và MySQL từ chối cả lượt
          insert. Có tag này thì GORM bỏ hẳn cột khỏi câu lệnh và database điền 'web'
          — đơn vào sổ với kênh đúng của nó thay vì cả thao tác gãy.
        type: string
      confirmed_at:
        type: string
      created_at:
        type: string
      delivered_at:
        type: string
      discount_amount:
        type: number
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/domain.OrderItem'
        type: array
      note:
        type: string
      order_code:
        type: string
      payment_method:
        type: string
      payment_status:
        type: string
      placed_at:
        type: string
      recipient_email:
        type: string
      recipient_name:
        type: string
      recipient_phone:
        type: string
      shipped_at:
        type: string
      shipping_address:
        type: string
      shipping_district:
        type: string
      shipping_fee:
        type: number
      shipping_method:
        type: string
      shipping_province:
        type: string
      shipping_ward:
        type: string
      shop_id:
        description: |-
          ShopID là CHI NHÁNH phát sinh đơn này: chi nhánh người bán đang làm việc
          (đơn tại quầy), hoặc chi nhánh bán online (đơn từ storefront — xem
          ChiNhanhRepository.BanOnline). Đây cũng là kho bị trừ hàng.
        type: integer
      status:
        type: string
      subtotal_amount:
        type: number
      total_amount:
        type: number
      tracking_number:
        type: string
      updated_at:
        type: string
      user_id:
        description: |-
          UserID nil = khách lẻ: người mua tại quầy không có tài khoản, và ép họ tạo
          một cái chỉ để bán được một lần là thứ không ai làm ở quầy thật.
        type: integer
      voucher_code:
        type: string
      voucher_id:
        type: integer
    type: object
  domain.OrderItem:
    properties:
      color:
        type: string
      created_at:
        type: string
      custom_player_name:
        type: string
      custom_player_number:
        type: string
      discount_amount:
        type: number
      discount_percent:
        description: |-
          DiscountPercent là mức người bán BẤM khi bớt giá dòng này (0 = không bớt),
          DiscountAmount là số tiền thật đã trừ. Giữ cả hai vì mỗi con số trả lời một
          câu khác nhau lúc đối soát: "ai được phép duyệt mức này" và "đã bớt bao
          nhiêu tiền".
        type: number
      id:
        type: integer
      order_id:
        type: integer
      product_id:
        type: integer
      product_name:
        type: string
      product_variant_id:
        type: integer
      quantity:
        type: integer
      size:
        type: string
      thumbnail:
        type: string
      total_price:
        description: 'TotalPrice là số tiền dòng này góp vào đơn: đơn giá × số lượng
          − phần đã bớt.'
        type: number
      unit_price:
        type: number
      updated_at:
        type: string
      variant_sku:
        type: string
    type: object
  domain.OrderReport:
    properties:
      buckets:
        items:
          $ref: '#/definitions/domain.ReportBucket'
        type: array
      by_channel:
        description: key = member | guest
        items:
          $ref: '#/definitions/domain.ReportSlice'
        type: array
      by_hour:
        description: luôn đủ 24 mốc, key = "0".."23"
        items:
          $ref: '#/definitions/domain.ReportSlice'
        type: array
      by_province:
        description: key = tên tỉnh/thành, đơn nhiều nhất lên trước
        items:
          $ref: '#/definitions/domain.ReportSlice'
        type: array
      by_shipping:
        description: key = mã hình thức vận chuyển ("" = chưa khai)
        items:
          $ref: '#/definitions/domain.ReportSlice'
        type: array
      by_status:
        description: |-
          ByStatus đếm trên TOÀN BỘ đơn trong kỳ (có cả cancelled/returned), 8 trạng
          thái luôn đủ mặt kể cả khi bằng 0 — bảng trạng thái mà nhảy dòng theo kỳ thì
          không so sánh được giữa hai lần xem.
        items:
          $ref: '#/definitions/domain.ReportSlice'
        type: array
      by_weekday:
        description: luôn đủ 7 mốc, key = "1".."7" (1 = Thứ Hai)
        items:
          $ref: '#/definitions/domain.ReportSlice'
        type: array
      from:
        type: string
      group_by:
        type: string
      prev:
        $ref: '#/definitions/domain.OrderReportTotals'
      prev_from:
        type: string
      prev_to:
        type: string
      to:
        type: string
      totals:
        $ref: '#/definitions/domain.OrderReportTotals'
    type: object
  domain.OrderReportTotals:
    properties:
      aov:
        type: number
      cancelled:
        type: integer
      dead_rate:
        description: '% đơn huỷ + hoàn trên tổng đơn'
        type: number
      net:
        type: integer
      returned:
        type: integer
      revenue:
        type: number
      total:
        type: integer
      units:
        type: integer
      units_per_order:
        type: number
      unpaid_amount:
        type: number
      unpaid_orders:
        description: Đơn còn hiệu lực nhưng chưa thu được tiền — phần doanh thu mới
          chỉ nằm trên giấy.
        type: integer
    type: object
  domain.OrderReturnHistory:
    properties:
      changed_by:
        type: integer
      created_at:
        type: string
      from_status:
        type: string
      id:
        type: integer
      note:
        type: string
      return_id:
        type: integer
      to_status:
        type: string
    type: object
  domain.OrderReturnItem:
    properties:
      color:
        type: string
      created_at:
        type: string
      id:
        type: integer
      order_item_id:
        type: integer
      product_id:
        type: integer
      product_name:
        type: string
      product_variant_id:
        type: integer
      quantity:
        type: integer
      return_id:
        type: integer
      size:
        type: string
      thumbnail:
        type: string
      total_price:
        type: number
      unit_price:
        type: number
      updated_at:
        type: string
      variant_sku:
        type: string
    type: object
  domain.OrderStats:
    properties:
      cancelled:
        type: integer
      completed:
        type: integer
      pending:
        type: integer
      processing:
        type: integer
      revenue:
        type: number
      shipping:
        type: integer
      total:
        type: integer
    type: object
  domain.OrderStatusHistory:
    properties:
      changed_by:
        type: integer
      created_at:
        type: string
      from_status:
        type: string
      id:
        type: integer
      note:
        type: string
      order_id:
        type: integer
      to_status:
        type: string
    type: object
  domain.PlatformUser:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      last_login_at:
        type: string
      role:
        description: 'Role: owner | operator | support'
        type: string
      status:
        description: 'Status: active | locked'
        type: string
      updated_at:
        type: string
    type: object
  domain.ProductReport:
    properties:
      by_brand:
        items:
          $ref: '#/definitions/domain.ReportSlice'
        type: array
      by_category:
        description: |-
          Ba lát cắt cùng dạng: `key` là id (danh mục/thương hiệu) hoặc chính giá trị
          (size), `label` là tên đọc được.
        items:
          $ref: '#/definitions/domain.ReportSlice'
        type: array
      by_size:
        items:
          $ref: '#/definitions/domain.ReportSlice'
        type: array
      from:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.ProductReportRow'
        type: array
      prev:
        $ref: '#/definitions/domain.ProductReportTotals'
      prev_from:
        type: string
      prev_to:
        type: string
      sort:
        example: revenue
        type: string
      to:
        type: string
      totals:
        $ref: '#/definitions/domain.ProductReportTotals'
      unsold_products:
        description: |-
          Số sản phẩm ĐANG BÁN mà cả kỳ không bán được món nào — phần vốn nằm chết,
          không nhìn bảng xếp hạng nào thấy được.
        type: integer
    type: object
  domain.ProductReportRow:
    properties:
      brand_name:
        type: string
      category_name:
        type: string
      cost:
        type: number
      margin:
        type: number
      name:
        type: string
      orders:
        type: integer
      product_id:
        type: integer
      profit:
        type: number
      revenue:
        type: number
      sku:
        type: string
      slug:
        type: string
      stock:
        description: tồn kho HIỆN TẠI, để biết bán chạy mà còn hàng không
        type: integer
      thumbnail:
        type: string
      units:
        type: integer
    type: object
  domain.ProductReportTotals:
    properties:
      cost:
        type: number
      margin:
        description: '% lợi nhuận gộp trên doanh thu hàng'
        type: number
      orders:
        type: integer
      products_sold:
        description: số sản phẩm KHÁC NHAU bán được
        type: integer
      profit:
        type: number
      revenue:
        type: number
      units:
        type: integer
    type: object
  domain.PromotionStats:
    properties:
      ended:
        type: integer
      paused:
        type: integer
      running:
        type: integer
      scheduled:
        type: integer
      total:
        type: integer
    type: object
  domain.PurchaseOrderHistory:
    properties:
      changed_by:
        type: integer
      created_at:
        type: string
      from_status:
        type: string
      id:
        type: integer
      note:
        type: string
      purchase_order_id:
        type: integer
      to_status:
        type: string
    type: object
  domain.PurchaseOrderItem:
    properties:
      color:
        type: string
      created_at:
        type: string
      id:
        type: integer
      product_id:
        type: integer
      product_name:
        type: string
      product_variant_id:
        type: integer
      purchase_order_id:
        type: integer
      quantity:
        type: integer
      received_quantity:
        description: ReceivedQuantity cộng dồn qua các đợt nhận; bằng Quantity là
          dòng đã đủ hàng.
        type: integer
      size:
        type: string
      thumbnail:
        type: string
      total_cost:
        type: number
      unit_cost:
        type: number
