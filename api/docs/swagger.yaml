        hợp đồng. Sổ thu trống thì doanh thu là 0 kể cả khi có hợp đồng đang chạy
        — và đó là câu trả lời đúng.
        Lọc theo NGÀY TIỀN VÀO. `tu` tính từ 00:00 ngày đó, `den` là mốc CHẶN
        TRÊN không bao gồm — muốn trọn tháng 8 thì tu=2026-08-01&den=2026-09-01.
      parameters:
      - description: Mã phần mềm; bỏ trống = mọi phần mềm được giao
        in: query
        name: app
        type: string
      - description: Từ ngày, dạng 2006-01-02
        in: query
        name: tu
        type: string
      - description: Tới ngày (không bao gồm), dạng 2006-01-02
        in: query
        name: den
        type: string
      produces:
      - application/json
      responses:
