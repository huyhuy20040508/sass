        Chuyển đơn sang trạng thái kế tiếp hợp lệ theo luồng xử lý. Khi huỷ đơn, trường `note` là lý do huỷ. Mỗi lần chuyển đều được ghi vào lịch sử đơn. Chuyển sang `cancelled` hoặc `returned` sẽ TRẢ HÀNG VỀ KHO đúng bằng số đơn đã lấy khỏi kho (ghi bút toán `return` vào sổ kho); đơn chưa từng trừ kho thì không cộng khống.
        Đơn có recipient_email thì khách nhận email báo trạng thái mới (chạy nền) với các mốc: confirmed, shipping, delivered, completed, cancelled, returned — riêng `processing` là bước nội bộ nên không gửi.
      parameters:
      - description: ID đơn hàng
        in: path
        name: id
        required: true
        type: integer
      - description: Trạng thái mới
        in: body
