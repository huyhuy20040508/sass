  /admin/goi-dich-vu:
    get:
      description: |-
        Hợp đồng hiện tại của CHÍNH cửa hàng này (gói, hạn mức đã ký, ngày hết
        hạn, số ngày còn lại) kèm bảng giá đang bán của phần mềm để chủ tiệm biết
        gia hạn hết bao nhiêu.
        `hop_dong` = null nghĩa là cửa hàng chưa có hợp đồng nào trong sổ nền
        tảng — trạng thái hợp lệ, không phải lỗi.
        Hạn mức đọc THẲNG ở hợp đồng, không tra sang bảng giá: bảng giá đổi được,
        hợp đồng đã ký thì không. Giá trị 0 nghĩa là không giới hạn.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.GoiDichVuCuaToiResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Gói dịch vụ của cửa hàng đang đăng nhập
      tags:
      - Admin - Gói dịch vụ
  /admin/goi-dich-vu/dat:
    post:
      consumes:
      - application/json
      description: |-
        Tạo đơn gia hạn cho hợp đồng hiện tại của cửa hàng đang đăng nhập rồi sinh
        link thanh toán. Số tiền do MÁY CHỦ tính (giá bảng giá × số tháng) và chốt
        vào đơn — bảng giá đổi sau đó không làm đổi số khách phải trả.
        Đơn cũ còn hiệu lực cho cùng gói và cùng số tháng thì trả lại đơn đó thay vì
        sinh link mới.
        Gói "Liên hệ" (chưa công bố giá) và gói đã ngừng bán đều bị từ chối.
      parameters:
      - description: Gói và số tháng
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DatGiaHanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.DonGiaHanResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Đặt đơn gia hạn và lấy link thanh toán
      tags:
      - Admin - Gói dịch vụ
  /admin/goi-dich-vu/don/{id}:
    get:
      description: |-
        Trang thanh toán hỏi lại đường này mỗi vài giây. Đơn còn chờ thì máy chủ HỎI
        THẲNG CỔNG xem tiền vào chưa — đây là đường xác nhận dự phòng cho webhook,
        cần cho cả lúc chạy ở máy local (cổng không gọi vào localhost được) lẫn lúc
        webhook tới trễ.
        Tiền đã vào thì chính lượt gọi này chốt đơn: ghi sổ thu, đẩy hạn hợp đồng và
        mở khoá cửa hàng. Chốt đúng MỘT LẦN cho mỗi đơn, dù gọi bao nhiêu lần.
      parameters:
      - description: ID đơn gia hạn
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.DonGiaHanResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Trạng thái một đơn gia hạn
      tags:
      - Admin - Gói dịch vụ
  /admin/inventory:
    get:
      consumes:
      - application/json
      description: |-
        Liệt kê tồn kho theo TỪNG BIẾN THỂ (size/màu/phiên bản) kèm thông tin sản phẩm cha, giá bán hiệu lực, giá vốn hiệu lực và giá trị hàng đang nằm trong kho. Mặc định sắp xếp tồn ít lên trước.
        `stock_value` tính theo GIÁ VỐN (`cost_price` của biến thể, không có thì của sản phẩm cha) × tồn kho — giá trị tồn kho về kế toán phải theo giá vốn chứ không phải giá bán. `cost_price` rỗng nghĩa là chưa khai giá vốn, biến thể đó đóng góp 0₫ vào giá trị kho.
        `stock=low` lọc theo ngưỡng `low_stock` (mặc định 5): tồn còn lớn hơn 0 nhưng không vượt ngưỡng. `stock=out` là đã hết sạch, `stock=in` là còn trên ngưỡng.
      parameters:
      - description: Tên sản phẩm / SKU biến thể / SKU sản phẩm
        in: query
        name: keyword
        type: string
      - description: Lọc theo danh mục
        in: query
        name: category_id
        type: integer
      - description: Lọc theo thương hiệu
        in: query
        name: brand_id
        type: integer
      - description: all|in|low|out
        in: query
        name: stock
        type: string
      - description: all|missing (chưa khai giá vốn)|set (đã khai)
        in: query
        name: cost
        type: string
      - description: Lọc theo trạng thái bán của biến thể
        in: query
        name: is_active
        type: boolean
      - description: Ngưỡng sắp hết (mặc định 5, tối đa 1000)
        in: query
        name: low_stock
        type: integer
      - description: stock_asc|stock_desc|name_asc|name_desc|value_desc|newest
        in: query
        name: sort
        type: string
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số item/trang (mặc định 20, tối đa 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.InventoryItem'
                  type: array
                meta:
                  $ref: '#/definitions/response.Pagination'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Danh sách tồn kho
      tags:
      - Admin - Inventory
  /admin/inventory/{id}:
    get:
      consumes:
      - application/json
      description: Thông tin biến thể kèm 20 bút toán kho gần nhất (nhập / xuất /
        kiểm kê / hàng trả về), đã ghép sẵn tên người thực hiện và mã chứng từ liên
        quan.
      parameters:
      - description: ID biến thể sản phẩm
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.InventoryDetail'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Chi tiết tồn kho một biến thể
      tags:
      - Admin - Inventory
    put:
      consumes:
      - application/json
      description: |-
        Đặt lại tồn kho (`mode=set`, dùng khi kiểm kê) hoặc cộng/trừ một lượng (`mode=delta`, số âm là xuất bớt). Biến thể được khoá trong lúc tính nên hai nhân viên chỉnh cùng lúc không ghi đè lên nhau.
        Mỗi lần chỉnh đều ghi một bút toán vào sổ kho với `reference_type='manual'` kèm người thực hiện — tồn kho không bao giờ đổi mà không để lại dấu vết.
        Tồn kho sau khi chỉnh mà âm thì bị từ chối, không có dòng nào được ghi.
      parameters:
      - description: ID biến thể sản phẩm
        in: path
        name: id
        required: true
        type: integer
      - description: Thông tin chỉnh kho
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.InventoryAdjustRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/domain.InventoryAdjustResult'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Chỉnh tồn kho một biến thể
      tags:
      - Admin - Inventory
  /admin/inventory/{id}/history:
    get:
      consumes:
      - application/json
      description: Toàn bộ bút toán nhập/xuất của một biến thể, mới nhất trước, có
        phân trang. Đây là nguồn sự thật của tồn kho; `stock_quantity` ở biến thể
        chỉ là số đã cộng dồn sẵn.
      parameters:
      - description: ID biến thể sản phẩm
        in: path
        name: id
        required: true
        type: integer
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số item/trang (mặc định 20, tối đa 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.InventoryHistory'
                  type: array
                meta:
                  $ref: '#/definitions/response.Pagination'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Sổ kho của một biến thể
      tags:
      - Admin - Inventory
  /admin/inventory/adjust:
    post:
      consumes:
      - application/json
      description: |-
        Cập nhật tồn của nhiều biến thể trong MỘT lần kiểm kê. Tất-cả-hoặc-không: một dòng sai (biến thể không tồn tại, tồn sau khi chỉnh bị âm) thì toàn bộ bị huỷ, không có dòng nào ghi vào kho.
        Tối đa 200 dòng mỗi lần. Các biến thể được khoá theo thứ tự ID tăng dần nên thao tác này không khoá chéo với luồng đặt hàng.
      parameters:
      - description: Danh sách biến thể cần chỉnh
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.InventoryBulkAdjustRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.InventoryAdjustResult'
                  type: array
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Chỉnh tồn kho hàng loạt
      tags:
      - Admin - Inventory
  /admin/inventory/cost:
    put:
      consumes:
      - application/json
      description: |-
        Ghi giá vốn cho nhiều biến thể trong MỘT lần — dùng cho việc nhập giá vốn từ file. Tất-cả-hoặc-không: một biến thể không tồn tại thì toàn bộ bị huỷ, không dòng nào được ghi. Tối đa 200 dòng mỗi lần.
        Giá vốn ghi vào mức BIẾN THỂ (ghi đè giá vốn của sản phẩm cha). `cost_price` để null là XOÁ giá vốn riêng, cho biến thể quay về lấy theo sản phẩm cha — khác hẳn với khai giá vốn bằng 0.
        Thao tác này KHÔNG ghi sổ kho: đây là sửa thuộc tính của hàng, không phải hàng ra vào kho.
      parameters:
      - description: Danh sách biến thể cần khai giá vốn
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.InventoryCostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Khai giá vốn hàng loạt
      tags:
      - Admin - Inventory
  /admin/inventory/stats:
    get:
      consumes:
      - application/json
      description: |-
        Đếm biến thể theo mức tồn (còn hàng / sắp hết / hết hàng), tổng số lượng đang có và tổng giá trị hàng trong kho theo GIÁ VỐN. Số liệu tính trên TOÀN kho, không phụ thuộc bộ lọc đang áp.
        `missing_cost` là số biến thể còn hàng nhưng chưa khai giá vốn — phần hàng đó không nằm trong `stock_value`, khác 0 nghĩa là tổng đang thiếu.
      parameters:
      - description: Ngưỡng sắp hết (mặc định 5, tối đa 1000)
        in: query
        name: low_stock
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/domain.InventoryStats'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Thống kê tồn kho
      tags:
      - Admin - Inventory
  /admin/me:
