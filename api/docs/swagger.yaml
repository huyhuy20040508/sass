  /admin/orders/pos/scan:
    get:
      consumes:
      - application/json
      description: |-
        Tra MỘT món hàng theo mã vạch in trên sản phẩm, hoặc theo SKU nếu cửa hàng tự in tem — thử mã vạch trước, SKU sau.
        Trả về giá bán THẬT (đã trừ khuyến mãi đang chạy) và tồn kho của CHI NHÁNH đang bán, lấy qua đúng đường tra giá của luồng đặt hàng nên con số này bằng con số sẽ thu khi chốt đơn.
        Không tìm thấy mã, hoặc tìm thấy nhưng sản phẩm đã ẩn / ngừng bán, đều trả 400 — với người đứng quầy thì cả hai đều là "món này không bán được".
      parameters:
      - description: Mã vạch hoặc SKU
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.POSScanResponse'
              type: object
        "400":
          description: Không tìm thấy mã, hoặc hàng không còn bán
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Quét mã vạch tại quầy
      tags:
      - Admin - Orders
  /admin/orders/revenue:
    get:
      consumes:
      - application/json
      description: |-
        Chuỗi doanh thu + số đơn của TỪNG NGÀY trong `days` ngày gần nhất (tính cả hôm nay), dùng vẽ biểu đồ ở trang tổng quan. Ngày không có đơn vẫn xuất hiện với giá trị 0 để đường biểu đồ không nối tắt qua ngày trống.
        Trả kèm tổng doanh thu & số đơn của KỲ TRƯỚC cùng độ dài (`prev_revenue`, `prev_orders`) để giao diện tính mức tăng/giảm mà không phải gọi thêm lần nữa.
        Cùng quy ước với thống kê đơn hàng: KHÔNG tính đơn huỷ và đơn hoàn hàng vào doanh thu.
      parameters:
      - description: Số ngày muốn xem (mặc định 30, tối thiểu 1, tối đa 365)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/domain.RevenueSummary'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Body'
