  /platform/plans/{id}:
    put:
      consumes:
      - application/json
      description: |-
        Ghi phần THƯƠNG MẠI của một dòng bảng giá: tên, mô tả, giá, số ngày dùng
        thử, còn bán hay không. Mã gói, app và chu kỳ KHÔNG sửa được — bộ ba đó là
        danh tính của dòng và hợp đồng đã ký tra tên gói về đây theo mã; muốn một
        mức giá khác thì thêm dòng mới.
        `price` gửi `null` nghĩa là "Liên hệ" (chưa công bố giá), KHÁC hẳn gửi 0
        (miễn phí). `status` = retired là ngừng bán mới, không xoá dòng.
        CHỈ vai trò owner/operator của khu điều hành ghi được; support chỉ đọc.
        Sửa ở đây KHÔNG đụng tới khách đang dùng: thuê bao chép giá ra lúc ký và
        sống độc lập với bảng giá.
