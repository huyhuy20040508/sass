      payment_method:
        description: |-
          PaymentMethod chỉ nhận hình thức mà tiền ĐÃ về trước khi khách rời quầy:
          tiền mặt, hoặc khách tự chuyển khoản và người bán nhìn thấy báo có. Cổng
          thanh toán online (payos/sepay) không nằm ở đây vì đơn quầy được ghi "đã
          thanh toán" ngay lúc tạo, mà tiền qua cổng thì phải đợi cổng báo về.
        enum:
        - cash
        - bank_transfer
        type: string
      user_id:
        description: |-
          UserID gắn đơn vào một tài khoản khách CÓ SẴN — dùng khi khách quen muốn
          tích luỹ lịch sử mua. Bỏ trống (0) là khách lẻ: quầy phải bán được cho người
          không có tài khoản, ép tạo hồ sơ chỉ để tính tiền một lần là thứ không ai
          làm giữa lúc có người đứng đợi.
        type: integer
      voucher_code:
        description: |-
          VoucherCode là mã giảm giá khách xuất trình. Mức giảm do server tự tính lại
          trên giá tại thời điểm bán — cùng đường với luồng web.
        maxLength: 50
        type: string
    required:
    - items
    - payment_method
    type: object
  dto.POSCheckoutResponse:
    properties:
      amount_tendered:
        description: |-
          AmountTendered / ChangeAmount vắng mặt khi không thu tiền mặt. Số tiền thối
          là thứ người bán cần đọc to lên ngay, nên nó do server tính chứ không để mỗi
          màn hình tự trừ theo cách của mình.
        type: number
      change_amount:
        type: number
      discount_amount:
        type: number
      line_discount_amount:
        description: |-
          LineDiscount là TỔNG số tiền đã bớt trên từng món (khác Discount — phần mã
          giảm giá trừ trên cả đơn). Tách riêng vì phiếu in phải nói rõ tiền đi đâu:
          gộp chung thì khách nhìn một con số giảm mà không biết nó đến từ món nào.
        type: number
      message:
        type: string
      order_code:
        type: string
      order_id:
        type: integer
      payment_method:
        type: string
      payment_status:
        type: string
      status:
        type: string
      subtotal_amount:
        description: |-
          Subtotal là tiền hàng theo giá server tra được (đã trừ khuyến mãi từng dòng),
          Discount là phần mã giảm giá trừ thêm trên cả đơn.
        type: number
      total_amount:
        type: number
      voucher_code:
        type: string
    type: object
  dto.POSItemRequest:
    properties:
      custom_player_name:
        maxLength: 50
        type: string
      custom_player_number:
        maxLength: 10
        type: string
      discount_percent:
        description: |-
          DiscountPercent là mức bớt giá của riêng dòng này (0–100). Nhân viên bị chặn
          ở mức cấu hình trong Cài đặt → Quầy bán hàng; chủ cửa hàng và quản trị viên
          không bị chặn.
        maximum: 100
        minimum: 0
        type: number
      product_variant_id:
        minimum: 1
        type: integer
      quantity:
        maximum: 99
        minimum: 1
        type: integer
    required:
    - product_variant_id
    - quantity
    type: object
  dto.POSScanResponse:
    properties:
      barcode:
        type: string
      color:
        type: string
      price:
        description: |-
          Price là giá bán thật: giá riêng của biến thể (nếu có) đã trừ khuyến mãi
          đang chạy.
        type: number
      product_id:
        type: integer
      product_name:
        type: string
      product_variant_id:
        type: integer
      size:
        type: string
      sku:
        type: string
      stock:
        type: integer
      thumbnail:
        type: string
    type: object
  dto.PaymentStatusResponse:
    properties:
      amount:
        type: number
      checkout_url:
        description: CheckoutURL còn hiệu lực thì trả lại để khách trả tiếp, rỗng
          nếu link đã khép.
        type: string
      message:
        type: string
      order_code:
        type: string
      paid:
        type: boolean
      status:
        description: 'Status: pending | paid | failed | cancelled | expired'
        type: string
    type: object
  dto.PlanFeatureField:
    properties:
      cho_vo_han:
        description: 'ChoVoHan = true: khoá này nhận giá trị "vo_han" ngoài các con
          số.'
        example: true
        type: boolean
      don_vi:
        description: DonVi in sau ô nhập ("tài khoản", "sản phẩm"). Rỗng với khoá
          bật/tắt.
        example: tài khoản
        type: string
      key:
        example: max_users
        type: string
      khong_co_dong:
        description: |-
          KhongCoDong là điều người đọc thấy khi gói KHÔNG có dòng cho khoá này:
          "0" với khoá bật/tắt (mặc định là tắt), rỗng với hạn mức (bảng giá không
          quy định, chốt lúc ký hợp đồng).
        example: ""
        type: string
      label:
        example: Số tài khoản
        type: string
      max_num:
        description: |-
          MaxNum là trần server áp khi lưu (0 = không chặn). Trả ra để màn hình đặt
          max cho ô nhập, chặn ngay trên giao diện thay vì để bấm Lưu rồi mới báo lỗi.
        example: 1000
        type: number
      type:
        description: 'Type: so | co_khong'
        example: so
        type: string
    type: object
  dto.PlanFeaturesResponse:
    properties:
      fields:
        items:
          $ref: '#/definitions/dto.PlanFeatureField'
        type: array
      plan:
        $ref: '#/definitions/dto.PlanItem'
    type: object
  dto.PlanFeaturesUpdateRequest:
    properties:
      items:
        additionalProperties:
          type: string
        type: object
    required:
    - items
    type: object
  dto.PlanItem:
    properties:
      app_code:
        example: order
        type: string
      app_name:
        example: Sellio Order
        type: string
      billing_cycle:
        description: 'BillingCycle: thang | nam'
        example: thang
        type: string
      code:
        example: chuoi
        type: string
      features:
        additionalProperties:
          type: string
        type: object
      id:
        example: 3
        type: integer
      name:
        example: Chuỗi
        type: string
      price:
        description: Price nil = "Liên hệ" — chưa có giá công khai, KHÁC 0 (miễn phí).
        example: 499000
        type: number
      status:
        description: 'Status: active | retired'
        example: active
        type: string
      tagline:
        example: Từ hai cửa hàng trở lên
        type: string
      trial_days:
        example: 14
        type: integer
    type: object
  dto.PlansResponse:
    properties:
      fields:
        items:
          $ref: '#/definitions/dto.PlanFeatureField'
        type: array
      plans:
        items:
          $ref: '#/definitions/dto.PlanItem'
        type: array
    type: object
  dto.PlatformAuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: giây
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/domain.PlatformUser'
        description: |-
          User.Role là CHUỖI (owner | operator | support), không phải một đối tượng
          vai trò như bên cửa hàng — khu điều hành không có bảng RBAC riêng.
    type: object
  dto.ProductBulkDeleteRequest:
    properties:
      ids:
        items:
          type: integer
        maxItems: 200
        minItems: 1
        type: array
    required:
    - ids
    type: object
  dto.ProductRequest:
    properties:
      base_price:
        minimum: 0
        type: number
      brand_id:
        type: integer
      category_id:
        type: integer
      cost_price:
        description: |-
          CostPrice là giá vốn dùng tính giá trị tồn kho. Bỏ trống = chưa khai giá vốn
          (khác với 0), lúc đó biến thể của sản phẩm không được cộng vào giá trị kho.
        minimum: 0
        type: number
      description:
        type: string
      images:
        description: Thư viện ảnh sản phẩm — cùng quy ước con trỏ như Variants.
        items:
          $ref: '#/definitions/dto.ImageRequest'
        type: array
      is_active:
        description: |-
          IsActive giữ lại cho tương thích ngược (bản quản trị cũ chỉ biết cờ bật/tắt).
          Khi cả hai cùng gửi, Status thắng.
        type: boolean
      is_featured:
        type: boolean
      kit_type:
        enum:
        - fan
        - player
        type: string
      meta_description:
        maxLength: 320
        type: string
      meta_title:
        maxLength: 255
        type: string
      name:
        maxLength: 200
        type: string
      sale_price:
        minimum: 0
        type: number
      season:
        maxLength: 20
        type: string
      short_description:
        maxLength: 500
        type: string
      sku:
        maxLength: 64
        type: string
      slug:
        maxLength: 191
        type: string
      status:
        description: |-
          Status là trạng thái kinh doanh: active (đang bán) | hidden (tạm ẩn) |
          discontinued (ngừng kinh doanh). Bỏ trống thì lấy theo IsActive.
        enum:
        - active
        - hidden
        - discontinued
        type: string
      team:
        maxLength: 150
        type: string
      thumbnail:
        maxLength: 255
        type: string
      variants:
        description: |-
          Biến thể (size/màu). Con trỏ để phân biệt:
            nil     -> không đụng tới biến thể (vd: chỉ bật/tắt trạng thái).
            [] hoặc [...] -> đồng bộ đúng theo danh sách (thêm/sửa/xoá).
        items:
          $ref: '#/definitions/dto.VariantRequest'
        type: array
    required:
    - category_id
    - name
    - sku
    - slug
    type: object
  dto.ProductStatusRequest:
    properties:
      is_active:
        type: boolean
      status:
        enum:
        - active
        - hidden
        - discontinued
        type: string
    type: object
  dto.ProfileRequest:
    properties:
      avatar:
        maxLength: 255
        type: string
      full_name:
        maxLength: 150
        type: string
      phone:
        maxLength: 20
        type: string
    required:
    - full_name
    type: object
  dto.PromotionRequest:
    properties:
      brand_ids:
        items:
          type: integer
        type: array
      category_ids:
        items:
          type: integer
        type: array
      description:
        maxLength: 255
        type: string
      discount_type:
        enum:
        - percentage
        - fixed
        type: string
      discount_value:
        description: |-
          DiscountValue là % (1–100) khi type=percentage, hoặc số tiền giảm mỗi sản
          phẩm khi type=fixed. Trần trên của % được kiểm ở tầng service vì nó phụ
          thuộc discount_type.
        type: number
      end_at:
        example: 2026-09-01T23:59
        type: string
      is_active:
        type: boolean
      max_discount_amount:
        description: 'MaxDiscountAmount chỉ dùng khi giảm theo %: "giảm 30% nhưng
          tối đa 200.000đ".'
        type: number
      name:
        maxLength: 150
        type: string
      product_ids:
        description: |-
          Ba danh sách phạm vi. Phải có ít nhất một id ở một trong ba — chương trình
          không phạm vi thì không giảm cho ai, tạo ra chỉ để nằm đó gây hiểu nhầm.
        items:
          type: integer
        type: array
      start_at:
        example: 2026-08-10T08:00
        type: string
    required:
    - discount_type
    - discount_value
    - end_at
    - name
    - start_at
    type: object
  dto.PromotionResponse:
    properties:
      brand_ids:
        items:
          type: integer
        type: array
      category_ids:
        items:
          type: integer
        type: array
      created_at:
        type: string
      description:
        type: string
      discount_type:
        type: string
      discount_value:
        type: number
      end_at:
        example: 2026-09-01T23:59
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      max_discount_amount:
        type: number
      name:
        type: string
      product_count:
        description: |-
          ProductCount là số sản phẩm đang bán mà chương trình phủ tới (đã tính cả
          danh mục con).
        type: integer
      product_ids:
        items:
          type: integer
        type: array
      start_at:
        example: 2026-08-10T08:00
        type: string
      status:
        description: |-
          Status: running | scheduled | ended | paused — tính từ ngày giờ + is_active
          ở một chỗ duy nhất, để trang quản trị và storefront không tự suy mỗi nơi một kiểu.
        type: string
    type: object
  dto.PromotionStatusRequest:
