  dto.DangKyRequest:
    properties:
      dien_thoai:
        example: "0901234567"
        maxLength: 20
        type: string
      email:
        example: huy@example.com
        maxLength: 191
        type: string
      ma_cua_hang:
        example: quochuy
        type: string
      mat_khau:
        example: MatKhau@123
        minLength: 6
        type: string
      nguoi_lien_he:
        example: Nguyễn Quốc Huy
        maxLength: 150
        type: string
      ten_cua_hang:
        example: Cửa hàng Quốc Huy
        maxLength: 150
        type: string
      ten_dang_nhap:
        example: admin
        type: string
      website:
        description: |-
          Website là BẪY: một ô ẩn trong form, người thật không nhìn thấy nên luôn để
          trống, còn máy tự điền form thì điền hết mọi ô. Điền vào đây là bị từ chối.

          Rẻ và không phiền ai — khác hẳn captcha, thứ bắt mọi khách thật giải câu đố
          để chặn một nhóm nhỏ không phải khách. Nó không chặn được kẻ nhắm riêng vào
          mình, và không cố tỏ ra như vậy: chốt chặn thứ hai là giới hạn tần suất
          theo IP ở tầng route.
        maxLength: 200
        type: string
    required:
    - dien_thoai
    - ma_cua_hang
    - mat_khau
    - nguoi_lien_he
    - ten_cua_hang
    - ten_dang_nhap
    type: object
  dto.DangKyResponse:
    properties:
      dia_chi_dang_nhap:
        description: DiaChiDangNhap là URL Shop Admin của chính tiến trình này (cfg.App.ShopAdminURL).
        example: https://order.selliotech.store
        type: string
      goi:
        example: Khởi đầu
        type: string
      het_han:
        type: string
      ma_cua_hang:
        example: quochuy
        type: string
      ten_dang_nhap:
        example: admin
        type: string
    type: object
  dto.DatGiaHanRequest:
    properties:
      plan_id:
        example: 2
        type: integer
      so_thang:
        description: |-
          SoThang: 1–24. Dài hơn là một thoả thuận cần người nói chuyện với nhau, không
          phải một ô chọn trên màn hình.
        example: 3
        maximum: 24
        minimum: 1
        type: integer
    required:
    - plan_id
    - so_thang
    type: object
  dto.DoanhThuItem:
    properties:
      lan_cuoi:
        example: 13/08/2026
        type: string
