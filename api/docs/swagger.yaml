      description: |-
        Trả về `plans` (mỗi dòng là một mức giá: gói + app + chu kỳ, kèm `features`
        là hạn mức/tính năng đã khai của gói đó) và `fields` (siêu dữ liệu từng khoá
        tính năng: kiểu, nhãn, đơn vị, trần) để màn hình dựng ô nhập đúng kiểu.
        Khoá KHÔNG có trong `features` nghĩa là bảng giá không quy định — khác hẳn
