      password:
        maxLength: 72
        minLength: 6
        type: string
    required:
    - password
    type: object
  dto.UserRequest:
    properties:
      avatar:
        maxLength: 255
        type: string
      email:
        description: |-
          Email KHÔNG còn là tên đăng nhập (xem Username) nhưng vẫn bắt buộc và vẫn là
          UNIQUE key ở bảng users: nó là đường liên lạc và là chỗ bám của các chức năng
          gửi thư. Nhân viên không có email thật thì chủ shop đặt một địa chỉ nội bộ.
        maxLength: 191
        type: string
      full_name:
        maxLength: 150
        type: string
      password:
        description: |-
          Password chỉ dùng khi tạo mới; bỏ trống thì hệ thống cấp mật khẩu mặc định.
          Sửa tài khoản thì bỏ qua trường này — đổi mật khẩu có endpoint riêng.
        maxLength: 72
        minLength: 6
        type: string
      phone:
        maxLength: 20
        type: string
      role_id:
        example: 2
        type: integer
      status:
        enum:
        - active
        - inactive
        type: string
      username:
        description: |-
          Username là thứ người này gõ vào ô THỨ HAI của màn hình đăng nhập Shop Admin.
          Bắt buộc: tài khoản nội bộ không có tên đăng nhập thì tạo ra xong không vào
          được trang quản trị bằng đường nào cả.
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - role_id
    - status
    - username
    type: object
  dto.UserResponse:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      full_name:
        type: string
      id:
        type: integer
      last_login_at:
        type: string
      phone:
        type: string
      role_display_name:
        example: Quản trị viên
        type: string
      role_id:
        example: 2
        type: integer
      role_name:
        example: admin
        type: string
      status:
        example: active
        type: string
      username:
        type: string
    type: object
  dto.UserStatusRequest:
    properties:
      status:
        enum:
        - active
        - inactive
        type: string
    required:
    - status
    type: object
  dto.VariantRequest:
    properties:
      barcode:
        description: |-
          Barcode là mã vạch in trên hàng — cái máy quét ở quầy đọc được. Để trống
          nghĩa là chưa dán mã, và hai biến thể cùng để trống là chuyện bình thường;
          nhưng hai biến thể đang bán không được mang cùng một mã (DB chặn).
        maxLength: 64
        type: string
      color:
        maxLength: 50
        type: string
      cost_price:
        description: CostPrice bỏ trống = lấy giá vốn của sản phẩm cha.
        minimum: 0
        type: number
      id:
        description: '>0 = cập nhật dòng cũ; 0 = thêm mới'
        type: integer
      image:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      price:
        minimum: 0
        type: number
      size:
        maxLength: 20
        type: string
      sku:
        maxLength: 64
        type: string
      weight_gram:
        minimum: 0
        type: integer
    required:
    - size
    type: object
  dto.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  dto.VoucherAvailableItem:
    properties:
      code:
        type: string
      description:
        type: string
      discount_amount:
        description: Discount là số tiền mã này giảm cho giỏ hiện tại, 0 khi chưa
          đủ điều kiện.
        type: number
      discount_type:
        type: string
      discount_value:
        type: number
      end_at:
        example: 2026-09-01T23:59
        type: string
      max_discount_amount:
        type: number
      min_order_amount:
        type: number
      missing_amount:
        description: |-
          MissingAmount là số tiền còn thiếu để đạt đơn tối thiểu (0 khi đã đủ). Có nó
          thì giao diện nói được "mua thêm 200.000₫ để dùng mã này" thay vì chỉ làm mờ
          mã đi rồi để khách tự đoán vì sao.
        type: number
      usable:
        description: Usable = bấm phát là áp được ngay.
        type: boolean
    type: object
  dto.VoucherAvailableRequest:
    properties:
      phone:
        description: |-
          Phone là số điện thoại người nhận nếu khách đã điền — dùng để loại mã họ đã
          dùng hết lượt riêng, kể cả khi chưa đăng nhập.
        maxLength: 20
        type: string
      subtotal:
        description: |-
          Subtotal là tiền hàng của giỏ hiện tại, dùng để tính sẵn mỗi mã giảm được bao
          nhiêu và mã nào còn thiếu bao nhiêu mới dùng được.
        type: number
    required:
    - subtotal
    type: object
  dto.VoucherCheckRequest:
    properties:
      code:
        example: SALE10
        maxLength: 50
        type: string
      phone:
        description: |-
          Phone là số điện thoại người nhận nếu khách đã điền. Có nó thì hạn mức "mỗi
          khách N lượt" kiểm được ngay tại đây với cả khách chưa đăng nhập, thay vì để
          khách áp mã xong mới bị chặn lúc bấm đặt.
        maxLength: 20
        type: string
      subtotal:
        description: |-
          Subtotal là tiền hàng của giỏ hiện tại. Con số này chỉ dùng để XEM TRƯỚC —
          lúc đặt thật, API tính lại trên giá đã khoá chứ không tin số client gửi.
        type: number
    required:
    - code
    - subtotal
    type: object
  dto.VoucherCheckResponse:
    properties:
      code:
        type: string
      description:
        type: string
      discount_amount:
        type: number
      subtotal:
        description: |-
          Subtotal / Total là tiền hàng trước và sau giảm. CHƯA gồm phí vận chuyển —
          phí ship tính trên tiền hàng trước giảm và client đã tự biết.
        type: number
      total:
        type: number
    type: object
  dto.VoucherRequest:
    properties:
      code:
        description: |-
          Code được chuẩn hoá về CHỮ HOA ở tầng service — khách gõ "sale10" vẫn trúng
          mã "SALE10". Chỉ nhận chữ không dấu, số, gạch ngang và gạch dưới.
        example: SALE10
        maxLength: 50
        type: string
      description:
        maxLength: 255
        type: string
      discount_type:
        enum:
        - percentage
        - fixed
        type: string
      discount_value:
        description: |-
          DiscountValue là % (1–100) khi type=percentage, hoặc số tiền giảm trên TỔNG
          ĐƠN khi type=fixed. Trần trên của % được kiểm ở tầng service vì nó phụ thuộc
          discount_type.
        type: number
      end_at:
        example: 2026-09-01T23:59
        type: string
      is_active:
        type: boolean
      is_public:
        description: |-
          IsPublic = true thì mã hiện thẳng ở ô nhập mã lúc thanh toán cho MỌI khách.
          Mặc định false — mã gửi tay cho một người mà khoe ra là ai cũng dùng được.
        type: boolean
      max_discount_amount:
        description: 'MaxDiscountAmount chỉ dùng khi giảm theo %: "giảm 20% nhưng
          tối đa 100.000₫".'
        type: number
      min_order_amount:
        description: MinOrderAmount là giá trị đơn tối thiểu để mã có hiệu lực (0
          = không yêu cầu).
        minimum: 0
        type: number
      start_at:
        example: 2026-08-10T08:00
        type: string
      usage_limit:
        description: |-
          UsageLimit là tổng số lượt dùng của mã, UsageLimitPerUser là số lượt mỗi
          khách. Để null = không giới hạn.
        type: integer
      usage_limit_per_user:
        type: integer
    required:
    - code
    - discount_type
    - discount_value
    type: object
  dto.VoucherResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      discount_type:
        type: string
      discount_value:
        type: number
      end_at:
        example: 2026-09-01T23:59
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_public:
        type: boolean
      max_discount_amount:
        type: number
      min_order_amount:
        type: number
      remaining:
        description: Remaining là số lượt còn lại, null khi không giới hạn tổng lượt.
        type: integer
      start_at:
        example: 2026-08-10T08:00
        type: string
      status:
        description: |-
          Status: running | scheduled | ended | used_up | paused — tính từ ngày giờ +
          lượt đã dùng + is_active ở MỘT chỗ duy nhất, để trang quản trị và storefront
          không tự suy mỗi nơi một kiểu.
        type: string
      usage_limit:
        type: integer
      usage_limit_per_user:
        type: integer
      used_count:
        type: integer
    type: object
  dto.VoucherStatusRequest:
    properties:
      is_active:
        type: boolean
    required:
    - is_active
    type: object
  response.Body:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
  response.Pagination:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  service.InventoryDetail:
    properties:
      histories:
        items:
          $ref: '#/definitions/domain.InventoryHistory'
        type: array
      item:
        $ref: '#/definitions/domain.InventoryItem'
      total:
        type: integer
    type: object
  service.OrderDetail:
    properties:
      admin_note:
        type: string
      amount_tendered:
        description: |-
          AmountTendered / ChangeAmount là tiền khách đưa và tiền thối lại tại quầy.
          nil = không thu bằng tiền mặt; 0 = có thu và khách đưa vừa đủ. Hai chuyện
          khác nhau, nên không dùng float64 với giá trị 0 cho cả hai.
        type: number
      can_cancel:
        description: |-
          CanCancel cho biết KHÁCH có được tự huỷ đơn này không. Storefront dựa vào đây
          để hiện nút huỷ, khỏi phải chép lại luật vào giao diện rồi lệch với server.
        type: boolean
      cancel_reason:
        type: string
      cancelled_at:
        type: string
      change_amount:
        type: number
      channel:
        description: |-
          Channel là NƠI đơn phát sinh: OrderChannelWeb (đơn có giao hàng — khách tự
          đặt hoặc nhân viên đặt hộ) hoặc OrderChannelPOS (bán tại quầy). Đơn quầy
          không có địa chỉ giao, sinh ra đã hoàn tất và đã thu tiền.

          default:web không thừa dù mọi đường tạo đơn đều tự khai: cột là ENUM NOT
          NULL, nên đường nào quên khai sẽ ghi chuỗi rỗng và MySQL từ chối cả lượt
          insert. Có tag này thì GORM bỏ hẳn cột khỏi câu lệnh và database điền 'web'
          — đơn vào sổ với kênh đúng của nó thay vì cả thao tác gãy.
        type: string
      confirmed_at:
        type: string
      created_at:
        type: string
      delivered_at:
        type: string
      discount_amount:
        type: number
      histories:
        items:
          $ref: '#/definitions/domain.OrderStatusHistory'
        type: array
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/domain.OrderItem'
        type: array
      next_statuses:
        description: NextStatuses là các trạng thái hợp lệ kế tiếp — admin dựng menu
          thao tác từ đây.
        items:
          type: string
        type: array
      note:
        type: string
      order_code:
        type: string
      payment_method:
        type: string
      payment_status:
        type: string
      placed_at:
        type: string
      recipient_email:
        type: string
      recipient_name:
        type: string
      recipient_phone:
        type: string
      shipped_at:
        type: string
      shipping_address:
        type: string
      shipping_district:
        type: string
      shipping_fee:
        type: number
      shipping_method:
        type: string
      shipping_province:
        type: string
      shipping_ward:
        type: string
      shop_id:
        description: |-
          ShopID là CHI NHÁNH phát sinh đơn này: chi nhánh người bán đang làm việc
          (đơn tại quầy), hoặc chi nhánh bán online (đơn từ storefront — xem
          ChiNhanhRepository.BanOnline). Đây cũng là kho bị trừ hàng.
        type: integer
      status:
        type: string
      subtotal_amount:
        type: number
      total_amount:
        type: number
      tracking_number:
        type: string
      updated_at:
        type: string
      user_id:
        description: |-
          UserID nil = khách lẻ: người mua tại quầy không có tài khoản, và ép họ tạo
          một cái chỉ để bán được một lần là thứ không ai làm ở quầy thật.
        type: integer
      voucher_code:
        type: string
      voucher_id:
        type: integer
    type: object
  service.PurchaseDetail:
    properties:
      can_edit:
        description: CanEdit = true khi phiếu còn sửa được (chưa nhận đợt hàng nào).
        type: boolean
      can_receive:
        description: CanReceive = true khi phiếu còn hàng để nhận.
        type: boolean
      cancel_reason:
        type: string
      cancelled_at:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      discount_amount:
        type: number
      expected_date:
        type: string
      handled_by:
        type: integer
      histories:
        items:
          $ref: '#/definitions/domain.PurchaseOrderHistory'
        type: array
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/domain.PurchaseOrderItem'
        type: array
      items_amount:
        type: number
      next_statuses:
        description: |-
          NextStatuses là các trạng thái hợp lệ kế tiếp — admin dựng menu thao tác từ
          đây thay vì chép lại luật vào giao diện rồi lệch với server.
        items:
          type: string
        type: array
      note:
        type: string
      ordered_at:
        type: string
      paid_amount:
        type: number
      payment_status:
        type: string
      po_code:
        type: string
      received_at:
        type: string
      shipping_fee:
        type: number
      shop_id:
        description: |-
          ShopID là chi nhánh ĐẶT hàng, và cũng là kho hàng sẽ về khi nhận. Chốt lúc
          lập phiếu chứ không lúc nhận: người nhận hàng có thể đang đứng ở chi nhánh
          khác, mà hàng thì về đúng nơi đã đặt.
        type: integer
      status:
        type: string
      supplier:
        $ref: '#/definitions/domain.Supplier'
      supplier_id:
        type: integer
      supplier_name:
        description: |-
          SupplierName là tên chụp lại lúc đặt — nhà cung cấp đổi tên hoặc bị xoá thì
          phiếu cũ vẫn đọc được đúng như lúc ký.
        type: string
      total_amount:
        type: number
      updated_at:
        type: string
    type: object
  service.PurchaseReturnDetail:
    properties:
      can_edit:
        type: boolean
      can_refund:
        type: boolean
      cancel_reason:
        type: string
      cancelled_at:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      handled_by:
        type: integer
      histories:
        items:
          $ref: '#/definitions/domain.PurchaseReturnHistory'
        type: array
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/domain.PurchaseReturnItem'
        type: array
      items_amount:
        type: number
      next_statuses:
        items:
          type: string
        type: array
      note:
        type: string
      po_code:
        type: string
      purchase_order_id:
        description: |-
          PurchaseOrderID có thể NULL nếu phiếu đặt gốc bị xoá; POCode/SupplierName là
          bản chụp lúc lập phiếu nên phiếu cũ vẫn đọc được nguyên trạng.
        type: integer
      reason:
        type: string
      refund_amount:
        description: RefundAmount là số NCC đã hoàn / đã đối trừ, LUỸ KẾ (không phải
          số vừa nhận).
        type: number
      refund_status:
        type: string
      refunded_at:
        type: string
      return_code:
        type: string
      returned_at:
        type: string
      shop_id:
        description: |-
          ShopID là chi nhánh trả hàng lại nhà cung cấp — lấy theo phiếu đặt gốc,
          cùng lý do với OrderReturn.
        type: integer
      status:
        type: string
      supplier_id:
        type: integer
      supplier_name:
        type: string
      updated_at:
        type: string
    type: object
  service.ReturnDetail:
    properties:
      admin_note:
        type: string
      approved_at:
        type: string
      bank_account:
        type: string
      bank_holder:
        type: string
      bank_name:
        type: string
      can_cancel:
        description: CanCancel cho biết KHÁCH có được tự rút yêu cầu này không.
        type: boolean
      closed_at:
        type: string
      created_at:
        type: string
      deduction:
        type: number
      handled_by:
        type: integer
      histories:
        items:
          $ref: '#/definitions/domain.OrderReturnHistory'
        type: array
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/domain.OrderReturnItem'
        type: array
      items_amount:
        type: number
      next_statuses:
        description: |-
          NextStatuses là các trạng thái hợp lệ kế tiếp — admin dựng menu thao tác từ
          đây thay vì chép lại luật vào giao diện rồi lệch với server.
        items:
          type: string
        type: array
      order:
        allOf:
        - $ref: '#/definitions/domain.Order'
        description: Order chỉ được nạp ở luồng danh sách/chi tiết để hiển thị mã
          đơn, người nhận.
      order_id:
        type: integer
      reason:
        type: string
      reason_note:
        type: string
      received_at:
        type: string
      refund_amount:
        type: number
      refund_method:
        type: string
      refunded_at:
        type: string
      reject_reason:
        type: string
      requested_by:
        type: string
      restock:
        description: Restock = false khi hàng trả về bị lỗi/hỏng, không nhập lại kho
          được.
        type: boolean
      return_code:
        type: string
      shipping_fee:
        type: number
      shop_id:
        description: |-
          ShopID là chi nhánh nhận hàng trả về — LUÔN lấy theo đơn gốc, không lấy
          theo chi nhánh người duyệt đang đứng: hàng quay về đúng kho đã xuất nó ra,
          nếu không thì hai kho cùng lệch, một bên thừa một bên thiếu.
        type: integer
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  service.ReturnableOrder:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.ReturnableItem'
        type: array
      order:
        $ref: '#/definitions/domain.Order'
      reason:
        type: string
      returnable:
        description: Returnable = false nghĩa là đơn không nằm trong diện trả hàng;
          Reason nói rõ vì sao.
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    name: Selliotech
  description: |-
    API của nền tảng bán hàng Selliotech — Clean Architecture (Go + Gin + GORM).
    Định dạng response: { "success": bool, "message": string, "data": any, "meta": any, "errors": any }.
  title: Selliotech API
  version: 0.1.0
paths:
  /admin/banners:
    get:
      description: Trả TOÀN BỘ banner, kể cả banner đang tắt và banner hẹn lịch cho
        đợt sau.
      parameters:
      - description: 'Lọc theo vị trí: home_slider, home_poster, home_kids'
        in: query
        name: position
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Danh sách banner (quản trị)
      tags:
      - Admin - Banners
    post:
      consumes:
      - application/json
      description: Bỏ trống `sort_order` thì banner mới được xếp xuống CUỐI vị trí
        đó.
      parameters:
      - description: Dữ liệu banner
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.BannerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Tạo banner
      tags:
      - Admin - Banners
  /admin/banners/{id}:
    delete:
      parameters:
      - description: ID banner
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Xóa banner
      tags:
      - Admin - Banners
    get:
      parameters:
      - description: ID banner
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
