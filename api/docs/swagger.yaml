  /platform/subscriptions:
    get:
      description: |-
        Màn hình "Người dùng thử" là `?nhom=dung_thu`, "Người dùng chính thức"
        là `?nhom=chinh_thuc`. Lọc theo NHÓM chứ không theo `trang_thai`: trạng
        thái đổi theo thời gian (hết hạn → past_due, huỷ → canceled) nên lọc
        theo nó thì hợp đồng biến mất khỏi màn hình đúng lúc cần nhìn nhất.
        Sắp theo ngày hết hạn gần nhất trước, hợp đồng đã huỷ xuống cuối —
        `con_lai_ngay` âm nghĩa là ĐÃ QUÁ HẠN.
        Hạn mức trong câu trả lời lấy THẲNG từ hợp đồng, không tra bảng giá: bảng
        giá được phép đổi, hợp đồng đã ký thì không. Giá trị 0 = không giới hạn.
      parameters:
      - description: Mã phần mềm; bỏ trống = mọi phần mềm được giao
        in: query
        name: app
        type: string
      - description: trial | active | past_due | canceled
        in: query
        name: trang_thai
        type: string
      - description: dung_thu | chinh_thuc; bỏ trống = cả hai nhóm
        in: query
