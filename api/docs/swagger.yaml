  /admin/orders:
    get:
      consumes:
      - application/json
      description: 'Lọc theo từ khoá (mã đơn/tên/SĐT/email người nhận), trạng thái
        đơn, tình trạng & phương thức thanh toán, khoảng ngày đặt; hỗ trợ sắp xếp
        và phân trang. Tham số `status` nhận NHIỀU trạng thái ngăn cách bởi dấu phẩy
        (VD: `pending,confirmed,shipping`) để lấy nhóm đơn như "chưa hoàn tất".'
      parameters:
      - description: Mã đơn / tên / SĐT / email người nhận
        in: query
        name: keyword
        type: string
      - description: all|pending|confirmed|processing|shipping|delivered|completed|cancelled|returned
          — cho phép nhiều giá trị ngăn cách bởi dấu phẩy
        in: query
        name: status
        type: string
      - description: all|pending|paid|failed|refunded
        in: query
        name: payment_status
        type: string
      - description: all|cod|vnpay|momo|bank_transfer|cash — `cash` là tiền mặt thu
          tại quầy
        in: query
        name: payment_method
        type: string
      - description: 'all|web|pos — nơi phát sinh đơn: `web` là đơn có giao hàng,
          `pos` là bán tại quầy'
        in: query
        name: channel
        type: string
      - description: Lọc đơn của một khách hàng
        in: query
        name: user_id
        type: integer
      - description: Từ ngày (YYYY-MM-DD)
        in: query
        name: from_date
        type: string
      - description: Đến ngày (YYYY-MM-DD)
        in: query
        name: to_date
        type: string
      - description: newest|oldest|total_desc|total_asc
        in: query
        name: sort
        type: string
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số item/trang (mặc định 20, tối đa 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                meta:
                  $ref: '#/definitions/response.Pagination'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Danh sách đơn hàng
      tags:
      - Admin - Orders
    post:
      consumes:
      - application/json
      description: |-
        Admin tạo đơn cho một KHÁCH HÀNG CÓ SẴN (user_id bắt buộc & phải tồn tại). Server tự tính tiền hàng, tổng tiền từ đơn giá × số lượng; đơn khởi tạo ở trạng thái "chờ xác nhận", "chưa thanh toán". TỒN KHO bị trừ ngay trong cùng transaction (có khoá biến thể + ghi sổ kho) như đơn khách đặt trên web; thiếu hàng thì trả 400 và không tạo đơn.
        Có recipient_email thì gửi email xác nhận đơn cho khách (chạy nền, gửi hỏng chỉ ghi log chứ không làm hỏng đơn).
      parameters:
