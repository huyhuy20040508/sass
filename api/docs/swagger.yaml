  /auth/facebook:
    post:
      consumes:
      - application/json
      description: |-
        Nhận `code` mà Facebook trả về sau khi khách bấm đồng ý ở hộp thoại đăng nhập,
        đổi lấy access token bằng app secret của máy chủ rồi đọc hồ sơ (id, tên, email, ảnh).
        Khớp `facebook_id` thì đăng nhập luôn; trùng email thì liên kết vào tài khoản sẵn có;
        chưa có gì thì tạo tài khoản khách hàng mới (không mật khẩu, email coi như đã xác thực).
        `redirect_uri` phải trùng từng ký tự với cái đã dùng lúc mở hộp thoại.
      parameters:
      - description: Mã đăng nhập Facebook
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.FacebookLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "401":
          description: Không xác minh được tài khoản Facebook
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Tài khoản đang không hoạt động
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Email đã được sử dụng
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Thiếu tham số, hoặc Facebook không chia sẻ email
          schema:
            $ref: '#/definitions/response.Body'
        "503":
          description: Cửa hàng chưa bật đăng nhập Facebook
          schema:
            $ref: '#/definitions/response.Body'
      summary: Đăng nhập bằng Facebook
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: |-
        Gửi mã 6 số về email để khách tự đặt lại mật khẩu.

        LUÔN trả 200 kể cả khi email chưa có tài khoản, hoặc là tài khoản
        nhân viên quản trị (nhóm này phải nhờ quản trị viên khác đặt lại).
        Báo thẳng "email chưa đăng ký" sẽ biến đường này thành công cụ dò
        xem ai là khách của cửa hàng.
      parameters:
      - description: Email nhận mã
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.RegisterResponse'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
        "429":
          description: Xin mã lại quá sớm, hoặc gọi quá dày
          schema:
            $ref: '#/definitions/response.Body'
        "502":
          description: Không gửi được email
          schema:
            $ref: '#/definitions/response.Body'
      summary: Quên mật khẩu — xin mã đặt lại
      tags:
      - Auth
  /auth/google:
    post:
      consumes:
      - application/json
      description: |-
        Nhận `code` mà Google trả về sau khi khách chọn tài khoản và bấm đồng ý,
        đổi lấy token bằng client secret của máy chủ rồi đọc hồ sơ (sub, tên, email, ảnh).
        Khớp `google_id` thì đăng nhập luôn; trùng email thì liên kết vào tài khoản sẵn có;
        chưa có gì thì tạo tài khoản khách hàng mới (không mật khẩu, email coi như đã xác thực).
        `redirect_uri` phải trùng từng ký tự với cái đã dùng lúc mở màn hình chọn tài khoản.
      parameters:
      - description: Mã đăng nhập Google
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "401":
          description: Không xác minh được tài khoản Google
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Tài khoản đang không hoạt động
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Email đã được sử dụng
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Thiếu tham số, hoặc tài khoản Google không có email đã xác
            minh
          schema:
            $ref: '#/definitions/response.Body'
        "503":
          description: Cửa hàng chưa bật đăng nhập Google
          schema:
            $ref: '#/definitions/response.Body'
      summary: Đăng nhập bằng Google
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Đăng nhập bằng email + mật khẩu, trả về access token và refresh
        token.
      parameters:
      - description: Thông tin đăng nhập
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      summary: Đăng nhập
      tags:
      - Auth
  /auth/me:
    get:
      description: Lấy thông tin người dùng hiện tại (yêu cầu đăng nhập).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Thông tin tài khoản
      tags:
      - Auth
  /auth/platform-login:
    post:
      consumes:
      - application/json
      description: |-
        Email + mật khẩu của một tài khoản trong sổ `platform_users` — sổ RIÊNG của
        nền tảng, không liên quan tới tài khoản của cửa hàng nào. Tài khoản cửa
        hàng (kể cả super_admin của một tiệm) KHÔNG vào được đường này.
        Token trả về mang cờ nền tảng và tenant_id = 0, nên nó chỉ mở được nhóm
        /platform và không mở được đường nào của khu cửa hàng.
      parameters:
      - description: Email + mật khẩu của người điều hành
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.PlatformAuthResponse'
              type: object
        "401":
          description: Sai email hoặc mật khẩu, hoặc tài khoản chưa đặt mật khẩu
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
        "503":
          description: Máy chủ chưa nối được sổ nền tảng
          schema:
            $ref: '#/definitions/response.Body'
      summary: Đăng nhập khu điều hành nền tảng
      tags:
      - Auth
  /auth/platform-me:
    get:
      description: Đọc từ sổ `platform_users` theo id trong token nền tảng.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/domain.PlatformUser'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Hồ sơ người điều hành đang đăng nhập
      tags:
      - Auth
  /auth/platform-refresh:
    post:
      consumes:
      - application/json
      description: |-
        Đường riêng vì /auth/refresh cố ý TỪ CHỐI mọi token không thuộc cửa hàng
        nào, mà token của khu điều hành thì luôn như vậy. Mỗi lượt làm mới đều đọc
        lại người điều hành trong sổ: người vừa bị khoá không gia hạn thêm được.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.PlatformAuthResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Body'
      summary: Làm mới token khu điều hành
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Dùng refresh token để lấy cặp token mới.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      summary: Làm mới token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Tạo tài khoản khách hàng (trạng thái chờ xác thực) và gửi mã 6 số qua email.
        Chưa trả token — cần gọi tiếp /auth/verify-email với mã nhận được trong thư.
        Nếu email đã đăng ký nhưng chưa xác thực thì tự gửi lại mã mới.
      parameters:
      - description: Thông tin đăng ký
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.RegisterResponse'
              type: object
        "409":
          description: Email đã được sử dụng
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
        "502":
          description: Không gửi được email xác thực
          schema:
            $ref: '#/definitions/response.Body'
      summary: Đăng ký khách hàng
      tags:
      - Auth
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Sinh mã mới và gửi lại qua email. Phải chờ MAIL_RESEND_AFTER (mặc
        định 60 giây) giữa 2 lần gửi.
      parameters:
      - description: Email cần gửi lại mã
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ResendCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.RegisterResponse'
              type: object
        "404":
          description: Email chưa đăng ký
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Email đã xác thực rồi
          schema:
            $ref: '#/definitions/response.Body'
        "429":
          description: Gửi lại quá sớm
          schema:
            $ref: '#/definitions/response.Body'
        "502":
          description: Không gửi được email
          schema:
            $ref: '#/definitions/response.Body'
      summary: Gửi lại mã xác thực
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: |-
        Đối chiếu mã 6 số vừa gửi rồi ghi mật khẩu mới. Sai mã 5 lần thì mã bị khoá, phải xin mã khác.

        KHÔNG trả token: đặt lại xong khách đăng nhập bằng mật khẩu mới như bình thường.
      parameters:
      - description: Email + mã + mật khẩu mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Mã sai / hết hạn / nhập sai quá nhiều lần
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Không phải tài khoản khách hàng
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
        "429":
          description: Gọi quá dày
          schema:
            $ref: '#/definitions/response.Body'
      summary: Quên mật khẩu — đặt mật khẩu mới
      tags:
      - Auth
  /auth/shop-login:
    post:
      consumes:
      - application/json
      description: |-
        Đăng nhập trang quản trị cửa hàng bằng mã cửa hàng + tên đăng nhập + mật khẩu.

        `shop_code` là mã KHÁCH HÀNG (bảng tenants), không phải mã chi nhánh.
        Sai bất kỳ ô nào cũng chỉ nhận về đúng một câu 401 chung — nói rõ ô nào sai
        là biến màn hình đăng nhập thành công cụ dò danh sách cửa hàng và tài khoản.
        Tài khoản khách mua sắm không vào được đường này (dùng /auth/login).
      parameters:
      - description: Mã cửa hàng, tên đăng nhập, mật khẩu
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ShopLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "401":
          description: Sai mã cửa hàng, tên đăng nhập hoặc mật khẩu
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Cửa hàng đang tạm khoá, hoặc tài khoản bị khoá
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      summary: Đăng nhập cửa hàng (3 ô)
      tags:
      - Auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: |-
        Đối chiếu mã 6 số đã gửi qua email. Đúng mã thì kích hoạt tài khoản và trả về JWT ngay.
        Mã hết hạn sau MAIL_CODE_TTL (mặc định 10 phút) và bị khoá sau 5 lần nhập sai.
      parameters:
      - description: Email và mã xác thực
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "400":
          description: Mã sai / hết hạn / nhập sai quá nhiều lần
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      summary: Xác thực email bằng mã
      tags:
      - Auth
  /banners:
    get:
      description: |-
        Chỉ trả banner ĐANG bật và NẰM TRONG lịch chạy, sắp sẵn theo thứ tự hiển thị.
        Bỏ trống `position` để lấy mọi vị trí một lượt (trang chủ dựng cả 3 khối bằng một lần gọi).
      parameters:
      - description: 'Vị trí: home_slider, home_poster, home_kids'
        in: query
        name: position
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Banner đang hiển thị (storefront)
      tags:
      - Banners
  /banners/positions:
    get:
      description: Mã vị trí hợp lệ để tạo banner. Đây là danh sách ĐÓNG — mỗi mã
        ứng với một khối cố định trên trang chủ.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Danh sách vị trí banner hỗ trợ
      tags:
      - Banners
  /brands:
    get:
      description: Mỗi thương hiệu kèm `product_count` — số sản phẩm (chưa xoá) đang
        gắn thương hiệu đó.
      parameters:
      - description: true = lấy cả thương hiệu ẩn
        in: query
        name: all
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Danh sách thương hiệu
      tags:
      - Brands
  /brands/{id}:
    get:
      description: Kèm `product_count` — số sản phẩm (chưa xoá) đang gắn thương hiệu
        này.
      parameters:
      - description: ID thương hiệu
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      summary: Chi tiết thương hiệu
      tags:
      - Brands
  /categories:
    get:
      parameters:
      - description: true = lấy cả danh mục ẩn
        in: query
        name: all
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Danh sách danh mục
      tags:
      - Categories
  /categories/{id}:
    get:
      parameters:
      - description: ID danh mục
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      summary: Chi tiết danh mục
      tags:
      - Categories
  /contact-requests:
    post:
      consumes:
      - application/json
      description: |-
        Nhận nội dung khách điền ở form Liên hệ hoặc form Thu mua áo đấu trên storefront.

        `type` để trống thì hiểu là `lien-he`. `images` là danh sách URL ảnh —
        storefront tự nhận tệp, kiểm tra rồi cất vào ổ đĩa của nó, đường này KHÔNG nhận tệp.
      parameters:
      - description: Nội dung yêu cầu
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateContactRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.ContactRequestResponse'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
        "429":
          description: Gửi quá dày
          schema:
            $ref: '#/definitions/response.Body'
      summary: Gửi yêu cầu liên hệ / thu mua
      tags:
      - Contact
  /dang-ky:
    post:
      consumes:
      - application/json
      - application/json
      description: |-
        Dựng TRỌN GÓI một khách hàng mới: cửa hàng + chi nhánh mặc định + tài
        khoản quản trị (data plane), rồi ký hợp đồng dùng thử (control plane).
        Bản HTTP của `cmd/thue-bao ky --dung-thu`, khác một điểm: KHÔNG cho khai
        tay giá và hạn mức — hợp đồng thử chạy đúng theo gói đang bán. Thoả thuận
        riêng vẫn đi qua công cụ dòng lệnh.
        Điều khoản CHÉP từ bảng giá lúc ký rồi sống độc lập: sửa bảng giá sau đó
        không đụng tới khách này. Bảng giá không quy định một hạn mức nào thì lượt
        ký bị TỪ CHỐI (422) chứ không đoán hộ con số.
        ĐƯỜNG CÔNG KHAI, không cần token: form đăng ký trên trang giới thiệu gọi thẳng vào đây.
        Gói do máy chủ chọn (Khởi đầu, chu kỳ tháng) — payload KHÔNG có `plan_id`, gửi lên cũng bị bỏ qua.
        Chặn lạm dụng bằng giới hạn tần suất theo IP ở tầng route và một ô bẫy (`website`) trong form.
      parameters:
      - description: Cửa hàng, tài khoản quản trị và dòng bảng giá
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.TaoDungThuRequest'
      - description: Thông tin cửa hàng mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DangKyRequest'
      produces:
      - application/json
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.DangKyResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.Body'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Khách tự mở tài khoản dùng thử
      tags:
      - Platform - Khách hàng
      - Đăng ký
  /events:
    get:
      description: 'Giữ một kết nối mở và đẩy sự kiện xuống trình duyệt: `notification`
        (thông báo mới, hiện lên chuông — gồm cả cảnh báo hàng sắp hết / hết hàng)
        và `order` (đơn vừa tạo/đổi trạng thái, màn hình nên tự làm mới). Vì EventSource
        không đặt được header Authorization nên endpoint này nhận thêm access token
        qua query `?token=`.'
      parameters:
      - description: Access token (thay cho header Authorization)
        in: query
        name: token
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Luồng SSE
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Luồng sự kiện thời gian thực (SSE)
      tags:
      - Notifications
  /health:
    get:
      description: Kiểm tra API còn sống và phiên bản hiện tại.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - System
  /newsletter/subscribe:
    post:
      consumes:
      - application/json
      description: |-
        Thêm email vào danh sách nhận tin ở chân trang.

        Email đã có trong danh sách vẫn trả 200: người dùng không nhớ mình từng
        đăng ký hay chưa, mà báo "email này đã đăng ký rồi" thì vừa vô ích vừa lộ
        ra ai đang có trong danh sách.
      parameters:
      - description: Email đăng ký
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SubscribeNewsletterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
        "429":
          description: Gửi quá dày
          schema:
            $ref: '#/definitions/response.Body'
      summary: Đăng ký nhận tin
      tags:
      - Contact
  /notifications:
    get:
      description: |-
        Trả thông báo theo kênh của người gọi: nhân viên quản trị nhận thông báo vận hành (đơn mới, khách huỷ đơn, cảnh báo tồn kho), khách hàng nhận thông báo đơn của chính mình. Kèm `unread_count` để vẽ badge trên chuông.
        Các giá trị `type`: `order_created`, `order_cancelled`, `order_status`, `order_payment`, `return_created`, `return_status`, `stock_low`, `stock_out`, `system`. Cột `data` là JSON tự do, giao diện dùng nó để mở đúng trang: `order_code` / `return_code` / `variant_sku` + `stock_level`.
      parameters:
      - description: true = chỉ lấy thông báo chưa đọc
        in: query
        name: unread
        type: boolean
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số dòng mỗi trang (mặc định 20, tối đa 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Danh sách thông báo của tôi
      tags:
      - Notifications
  /notifications/{id}/read:
    put:
      parameters:
      - description: ID thông báo
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Đánh dấu một thông báo đã đọc
      tags:
      - Notifications
  /notifications/read-all:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Đánh dấu tất cả thông báo đã đọc
      tags:
      - Notifications
  /orders:
    post:
      consumes:
      - application/json
      description: |-
        Khách ở storefront đặt hàng, không bắt buộc đăng nhập. Gửi kèm access token thì đơn được gắn vào tài khoản.
        Mỗi dòng hàng chỉ cần nói mua biến thể nào (product_variant_id, hoặc slug + size + color) và số lượng —
        TÊN, GIÁ, SKU đều được server tra lại từ database, giá client gửi lên bị bỏ qua hoàn toàn.
        Nên gửi product_variant_id: slug + size + color KHÔNG chỉ đúng một biến thể khi sản phẩm có nhiều phiên bản (FAN / PLAYER) cùng size và màu — thiếu ID thì server lấy biến thể có ID nhỏ nhất.
        Biến thể đã tắt bán (is_active = 0) bị từ chối kể cả khi client gửi thẳng ID của nó.
        Tồn kho được khoá và trừ ngay trong transaction nên nhiều khách đặt cùng lúc không bán vượt hàng.
        Phí vận chuyển: miễn phí từ 1.000.000₫, dưới ngưỡng thu 30.000₫. Đơn tạo ra ở trạng thái "chờ xác nhận".
        Có recipient_email thì hệ thống gửi email xác nhận đơn (chạy nền): gửi hỏng chỉ ghi log, đơn vẫn hợp lệ để khách không phải đặt lại và bị trừ kho hai lần.
        payment_method phải là hình thức cửa hàng đang nhận (Cài đặt → Thanh toán), nếu không trả 422. Chuyển khoản chỉ được nhận khi cửa hàng đã khai đủ ngân hàng, số tài khoản và chủ tài khoản; đơn chuyển khoản nhận lại hướng dẫn chuyển tiền trong `message` và trong email.
        payment_method = `payos` (thanh toán online): hệ thống xin cổng cấp link ngay trong lời gọi này và trả về ở trường `payos`. Cách dùng gọn nhất là gán `payos.qr_image` (ảnh PNG dạng data URI, đã vẽ sẵn) vào thẻ img cho khách quét tại chỗ; `payos.checkout_url` là trang của cổng dành cho khách dùng điện thoại không tự quét màn hình được, còn `payos.qr_code` là chuỗi VietQR thô nếu client muốn tự vẽ. Chỉ nhận được khi cửa hàng đã bật PayOS VÀ máy chủ API đã khai bộ khoá PayOS trong .env.
        Sau đó client hỏi `GET /payments/{code}` (với code = `payos.order_code`) vài giây một lần để biết tiền đã về chưa; chính lời gọi đó cũng là nơi hệ thống đối chiếu với cổng và đánh dấu đơn đã thanh toán.
        Cổng hỏng thì đơn VẪN được tạo (hàng đã trừ kho, địa chỉ đã điền) nhưng trường `payos` vắng mặt và `message` nói rõ phải liên hệ cửa hàng — không bắt khách đặt lại từ đầu.
      parameters:
      - description: Thông tin nhận hàng và danh sách sản phẩm
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CheckoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.CheckoutResponse'
              type: object
        "400":
          description: Hết hàng hoặc sản phẩm không còn bán
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Dữ liệu không hợp lệ, hoặc hình thức thanh toán cửa hàng không
            nhận
          schema:
            $ref: '#/definitions/response.Body'
      summary: Đặt hàng từ website (công khai)
      tags:
      - Orders
  /orders/me:
    get:
      consumes:
      - application/json
      description: |-
        Danh sách đơn của CHÍNH tài khoản đang đăng nhập, mới nhất trước, kèm sản phẩm từng đơn.
        Khách hàng chỉ thấy đơn của mình: id tài khoản lấy từ access token, không nhận `user_id` từ client.
        Ghi chú nội bộ của admin được ẩn khỏi kết quả.
      parameters:
      - description: 'Lọc trạng thái: all|pending|confirmed|processing|shipping|delivered|completed|cancelled|returned
          — nhiều giá trị ngăn cách bởi dấu phẩy'
        in: query
        name: status
        type: string
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số đơn/trang (mặc định 10, tối đa 50)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                meta:
                  $ref: '#/definitions/response.Pagination'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Đơn hàng của tôi (khách đã đăng nhập)
      tags:
      - Orders
  /orders/me/{id}:
    get:
      consumes:
      - application/json
      description: Đơn kèm sản phẩm và lịch sử chuyển trạng thái. Đơn KHÔNG thuộc
        tài khoản đang đăng nhập trả về 404 (không phải 403) để không lộ đơn của người
        khác qua việc thử ID.
      parameters:
      - description: ID đơn hàng
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.OrderDetail'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Chi tiết đơn hàng của tôi (khách đã đăng nhập)
      tags:
      - Orders
  /orders/me/{id}/cancel:
    post:
      consumes:
      - application/json
      description: |-
        Khách tự huỷ đơn của CHÍNH mình. Chỉ huỷ được khi đơn còn ở "chờ xác nhận" hoặc "đã xác nhận" —
        từ "đang chuẩn bị" trở đi hàng đã được soạn hoặc bàn giao vận chuyển nên phải liên hệ nhân viên (trả 409).
        Huỷ thành công thì TRẢ HÀNG VỀ KHO đúng bằng số đơn đã lấy, ghi mốc lịch sử và gửi email báo huỷ cho khách.
        Đơn không thuộc tài khoản đang đăng nhập trả 404 để không lộ đơn của người khác.
      parameters:
      - description: ID đơn hàng
        in: path
        name: id
        required: true
        type: integer
      - description: Lý do huỷ (không bắt buộc)
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.OrderCancelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.OrderDetail'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Đơn đã qua giai đoạn được tự huỷ hoặc đã huỷ trước đó
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Huỷ đơn hàng của tôi (khách đã đăng nhập)
      tags:
      - Orders
  /orders/me/{id}/returnable:
    get:
      consumes:
      - application/json
      description: |-
        Dùng để dựng form "Yêu cầu trả hàng" ở trang tài khoản: mỗi dòng hàng kèm số đã mua và số CÒN trả được.
        Cờ `returnable` = false nghĩa là đơn chưa/không còn trả được, `reason` nói rõ vì sao (chưa giao hàng, quá hạn đổi trả, đã trả hết).
        Đơn KHÔNG thuộc tài khoản đang đăng nhập trả về 404 (không phải 403) để không lộ đơn của người khác qua việc thử ID.
      parameters:
      - description: ID đơn hàng
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.ReturnableOrder'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Sản phẩm còn trả được của đơn tôi (khách đã đăng nhập)
      tags:
      - Returns
  /orders/quote:
    post:
      consumes:
      - application/json
      description: |-
        Tra lại GIÁ và TỒN KHO hiện tại cho từng dòng giỏ hàng rồi tính thử số tiền server sẽ tính nếu khách đặt ngay bây giờ.
        Giỏ hàng của storefront nằm ở localStorage nên giá lưu trong đó là bản chụp lúc khách thêm hàng; admin đổi giá xong thì con số ấy đã cũ.
        Trang thanh toán gọi endpoint này khi mở để cập nhật lại giỏ, thay vì để khách phát hiện chênh lệch ở màn đặt hàng thành công.
        Mỗi dòng trả về issue: rỗng (bình thường), "limited" (không đủ số lượng), "out_of_stock" (hết hàng), "unavailable" (không còn bán).
        Nên gửi product_variant_id như khi đặt hàng — thiếu ID thì dòng nào có nhiều phiên bản cùng size/màu sẽ báo giá theo biến thể ID nhỏ nhất.
        KHÔNG tạo đơn, KHÔNG giữ hàng — số tiền chính thức vẫn do luồng đặt hàng tính lại.
      parameters:
      - description: Danh sách sản phẩm trong giỏ
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CartQuoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.CartQuoteResponse'
              type: object
        "400":
          description: Giỏ hàng trống
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Dữ liệu không hợp lệ
          schema:
            $ref: '#/definitions/response.Body'
      summary: Đối chiếu giỏ hàng (công khai)
      tags:
      - Orders
  /payments/{code}:
    get:
      description: |-
        Dùng cho màn hình quét mã QR (hỏi lại vài giây một lần) và cho trang khách được
        cổng đưa quay lại sau khi trả tiền. `code` là `transaction_code` nhận được lúc đặt
        hàng — với PayOS là con số riêng của cổng, với SePay chính là mã đơn.
        Giao dịch còn đang chờ thì hệ thống hỏi thẳng cổng chứ không đợi webhook (PayOS:
        tra link; SePay: dò sao kê, cần SEPAY_API_TOKEN) — đây là đường xác nhận duy nhất
        chạy được khi API nằm ở máy local, vì cổng không gọi webhook vào localhost được.
        Tiền đã về thì đơn được đánh dấu đã thanh toán ngay tại lời gọi này.
      parameters:
      - description: Mã giao dịch phía cổng (transaction_code)
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaymentStatusResponse'
              type: object
        "404":
          description: Không có giao dịch nào mang mã này
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Cổng thanh toán chưa được cấu hình
          schema:
            $ref: '#/definitions/response.Body'
      summary: Tra tình trạng thanh toán của một giao dịch (công khai)
      tags:
      - Payments
  /payments/payos/webhook:
    post:
      consumes:
      - application/json
      description: |-
        PayOS gọi vào đây mỗi khi có tiền vào một link thanh toán. Đường này KHÔNG có token:
        thứ chứng minh gói dữ liệu đến từ PayOS là chữ ký HMAC-SHA256 ký bằng checksum key
        của kênh thanh toán, và mọi gói sai chữ ký đều bị từ chối.
        Ghi nhận là idempotent — PayOS gửi lại cùng một giao dịch nhiều lần thì chỉ lần đầu
        được tính, các lần sau vẫn nhận 200.
        Số tiền phải khớp đúng đơn; lệch thì hệ thống ghi nhận là thất bại để nhân viên đối soát tay.
        Địa chỉ này phải công khai trên Internet mới nhận được webhook — chạy ở máy local thì
        PayOS không gọi vào được, lúc đó đơn được xác nhận qua GET /payments/{order_code}.
      produces:
      - application/json
      responses:
        "200":
          description: Đã ghi nhận (hoặc đã bỏ qua vì trùng lặp)
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Chữ ký không hợp lệ hoặc body sai định dạng
          schema:
            $ref: '#/definitions/response.Body'
      summary: Webhook PayOS báo kết quả thanh toán (công khai)
      tags:
      - Payments
  /payments/sepay/webhook:
    post:
      consumes:
      - application/json
      description: |-
        SePay gọi vào đây mỗi khi tài khoản ngân hàng của cửa hàng có biến động số dư.
        Khác PayOS ở bản chất: gói dữ liệu này KHÔNG biết gì về đơn hàng, nó chỉ nói
        "tài khoản vừa nhận X đồng, nội dung là Y". Hệ thống dò xem mã đơn nào đang chờ
        có mặt trong nội dung đó để biết tiền thuộc về đơn nào.
        Thứ chứng minh gói dữ liệu đến từ SePay là khoá API trong header
        `Authorization: Apikey <khoá>` (khai ở SEPAY_WEBHOOK_API_KEY), không phải chữ ký dữ liệu.
        Giao dịch tiền RA bị bỏ qua; số tiền lệch với đơn thì ghi nhận là thất bại để
        nhân viên đối soát tay, không tự đánh dấu đã thanh toán.
        Tiền vào mà không khớp đơn nào (khách ghi sai nội dung) vẫn trả 200 kèm log —
        trả lỗi chỉ khiến SePay gửi lại gói đó suốt 5 tiếng.
      parameters:
      - description: Apikey <khoá webhook>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Đã nhận (hoặc đã bỏ qua vì không khớp đơn nào)
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Khoá webhook không hợp lệ
          schema:
            $ref: '#/definitions/response.Body'
      summary: Webhook SePay báo tài khoản có tiền vào (công khai)
      tags:
      - Payments
  /platform/apps:
    get:
      description: |-
        Chỉ những phần mềm NGƯỜI GỌI được phụ trách (owner thấy hết). Bộ chọn
        phần mềm ở đầu khu điều hành dựng từ đây.
        `so_goi_dang_ban` tách khỏi `status`: app đang chạy mà 0 gói đang bán thì
        vẫn chưa ai mua được. App 'planned' và 'retired' vẫn xuất hiện — đây là
        màn hình quản lý vòng đời của chúng.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.AppsResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Danh mục phần mềm của nền tảng
      tags:
      - Platform - Apps
  /platform/cau-hinh:
    get:
      description: |-
        Trả về `values` (map khoá → giá trị, đã ghép mặc định của registry) và
        `fields` (siêu dữ liệu từng ô: kiểu, nhãn, gợi ý, bắt buộc hay không) để
        màn hình dựng form mà không chép lại bảng khoá.
        Hôm nay gồm bộ thông tin NHẬN CHUYỂN KHOẢN dùng cho việc khách gia hạn.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.CauHinhNenTangResponse'
              type: object
