      tags:
      - Platform - Khách hàng
  /platform/dung-thu:
    post:
      consumes:
      - application/json
      - application/json
      description: |-
        Dựng TRỌN GÓI một khách hàng mới: cửa hàng + chi nhánh mặc định + tài
        khoản quản trị (data plane), rồi ký hợp đồng dùng thử (control plane).
        Bản HTTP của `cmd/thue-bao ky --dung-thu`, khác một điểm: KHÔNG cho khai
        tay giá và hạn mức — hợp đồng thử chạy đúng theo gói đang bán. Thoả thuận
        riêng vẫn đi qua công cụ dòng lệnh.
        Điều khoản CHÉP từ bảng giá lúc ký rồi sống độc lập: sửa bảng giá sau đó
        không đụng tới khách này. Bảng giá không quy định một hạn mức nào thì lượt
        ký bị TỪ CHỐI (422) chứ không đoán hộ con số.
        ĐƯỜNG CÔNG KHAI, không cần token: form đăng ký trên trang giới thiệu gọi thẳng vào đây.
        Gói do máy chủ chọn (Khởi đầu, chu kỳ tháng) — payload KHÔNG có `plan_id`, gửi lên cũng bị bỏ qua.
        Chặn lạm dụng bằng giới hạn tần suất theo IP ở tầng route và một ô bẫy (`website`) trong form.
      parameters:
      - description: Cửa hàng, tài khoản quản trị và dòng bảng giá
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.TaoDungThuRequest'
      - description: Thông tin cửa hàng mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DangKyRequest'
      produces:
      - application/json
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.DangKyResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.Body'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Khách tự mở tài khoản dùng thử
      tags:
      - Platform - Khách hàng
      - Đăng ký
