        type: string
      bank_name:
        maxLength: 150
        type: string
      deduction:
        minimum: 0
        type: number
      refund_method:
        enum:
        - none
        - cash
        - bank_transfer
        - ewallet
        type: string
      restock:
        description: |-
          Restock quyết định hàng có được nhập lại kho khi nhận về hay không. Chỉ còn
          đổi được trước khi phiếu chuyển sang "đã nhận hàng".
        type: boolean
      shipping_fee:
        minimum: 0
        type: number
    type: object
  dto.ReturnStatusRequest:
    properties:
      note:
        maxLength: 255
        type: string
      status:
        enum:
        - approved
        - received
        - refunded
        - rejected
        - cancelled
        type: string
    required:
    - status
    type: object
  dto.RoleResponse:
    properties:
      description:
        type: string
      display_name:
        example: Quản trị viên
        type: string
      id:
        type: integer
      internal:
        description: |-
          Internal = true: vai trò dùng cho nhân viên/quản trị, gán được ở trang
          "Người dùng & vai trò". Vai trò customer thì không.
        type: boolean
      name:
        example: admin
        type: string
      user_count:
        description: |-
          UserCount đếm cả khách hàng với vai trò customer — con số này là "bao nhiêu
          tài khoản đang mang vai trò", không phải "bao nhiêu nhân viên".
        type: integer
    type: object
  dto.RoleUpdateRequest:
    properties:
      description:
        maxLength: 255
        type: string
      display_name:
        maxLength: 100
        type: string
    required:
    - display_name
    type: object
  dto.SettingField:
    properties:
      default:
        example: "30000"
        type: string
      group:
        example: shipping
        type: string
      key:
        example: default_shipping_fee
        type: string
      label:
        example: Phí vận chuyển mặc định
        type: string
      max_len:
        description: |-
          MaxLen / MaxNum là giới hạn server sẽ áp khi lưu (0 = không chặn). Trả ra đây
          để form admin đặt maxlength/max cho ô nhập, chặn ngay trên giao diện thay vì
          để người dùng bấm Lưu rồi mới nhận lỗi.
        example: 0
        type: integer
      max_num:
        example: 1000000
        type: number
      public:
        description: 'Public = true: khoá này lộ ra ở GET /settings cho storefront
          đọc.'
        example: true
        type: boolean
      required:
        example: true
        type: boolean
      section:
        description: |-
          Section chia một trang cấu hình thành các khối (nhận diện / liên hệ / mạng
          xã hội). Rỗng = trang đó không chia khối.
        example: contact
        type: string
      type:
        description: 'Type: text | number | email | phone | image | url'
        example: number
        type: string
    type: object
  dto.SettingsResponse:
    properties:
      fields:
        items:
          $ref: '#/definitions/dto.SettingField'
        type: array
      values:
        additionalProperties:
          type: string
        type: object
    type: object
  dto.SettingsUpdateRequest:
    properties:
      items:
        additionalProperties:
          type: string
        type: object
    required:
    - items
    type: object
  dto.ShopLoginRequest:
    properties:
      password:
        type: string
      shop_code:
        description: |-
          ShopCode là tenants.code — MÃ KHÁCH HÀNG, không phải mã chi nhánh
          (shops.code). Gọi là "mã cửa hàng" vì đó là chữ người dùng nhìn thấy: chuỗi
          mình cấp lúc bàn giao phần mềm.
        maxLength: 30
        type: string
      username:
        maxLength: 50
        type: string
    required:
    - password
    - shop_code
    - username
    type: object
  dto.SuaGoiRequest:
    properties:
      name:
        example: Cửa hàng
        maxLength: 100
        type: string
      price:
        description: |-
          Price NULL = "Liên hệ" (chưa công bố giá), KHÁC 0 là miễn phí — nên nó là
          con trỏ, và màn hình phải gửi `null` chứ không phải chuỗi rỗng khi muốn
          "Liên hệ".

          Trần 1 tỷ: cột dưới database là DECIMAL(12,2) nên còn xa mới tràn, nhưng
          đây là GIÁ BÁN — gõ thừa một chữ số là một con số không ai định bán hiện
          lên landing, và không có gì phía sau chặn lại.
        example: 499000
        maximum: 1000000000
        minimum: 0
        type: number
      status:
        description: |-
          Status: active | retired. retired là NGỪNG BÁN MỚI, không xoá dòng — khách
          đang dùng gói đó không bị ảnh hưởng.
        enum:
        - active
        - retired
        example: active
        type: string
      tagline:
        example: Cho một cửa hàng bán đều tay
        maxLength: 255
        type: string
      trial_days:
        example: 14
        maximum: 365
        type: integer
    required:
    - name
    - status
    type: object
  dto.SuaHopDongRequest:
    properties:
      dien_thoai:
        example: "0901234567"
        maxLength: 20
        type: string
      email:
        example: huy@quochuy.vn
        maxLength: 150
        type: string
      ghi_chu_hop_dong:
        maxLength: 500
        type: string
      ghi_chu_khach:
        description: GhiChuKhach đi theo KHÁCH (sổ khách hàng), GhiChuHopDong chết
          cùng hợp đồng.
        maxLength: 500
        type: string
      het_han:
        description: |-
          HetHan nhận HAI dạng, và cả hai đều có lý do tồn tại:

            · `2006-01-02T15:04`  — có giờ. Đây là thứ ô <input type="datetime-local">
              gửi lên, và là dạng dùng khi cần chốt giờ chính xác ("hết hạn 9h sáng
              mai, trước cuộc hẹn lúc 10h").
            · `2006-01-02`        — ngày trần. Máy chủ tự lấy CUỐI ngày đó
              (23:59:59), vì "hết hạn ngày 30" trong đầu người nói nghĩa là hết ngày
              30 chứ không phải 0 giờ ngày 30 — hiểu theo cách kia là cắt của khách
              trọn một ngày.

          Bỏ trống = GIỮ NGUYÊN hạn hiện tại, khác mọi ô khác ở trên: "xoá ngày hết
          hạn" không phải một trạng thái tồn tại được.

          Chỉ nhận khi hợp đồng đang DÙNG THỬ. Hợp đồng đã trả tiền muốn dài thêm thì
          đi đường gia hạn, để đường tiền và đường hạn không tách khỏi nhau.
        example: 2026-09-30T17:30
        maxLength: 25
        type: string
      nguoi_lien_he:
        example: Anh Huy
        maxLength: 150
        type: string
      ten_cua_hang:
        example: Cửa hàng Quốc Huy
        maxLength: 150
        type: string
    required:
    - ten_cua_hang
    type: object
  dto.SubscribeNewsletterRequest:
    properties:
      email:
        maxLength: 191
        type: string
      source:
        maxLength: 30
        type: string
    required:
    - email
    type: object
  dto.SupplierRequest:
    properties:
      address:
        maxLength: 255
        type: string
      code:
        maxLength: 30
        type: string
      contact_name:
        maxLength: 150
        type: string
      email:
        maxLength: 191
        type: string
      is_active:
        description: IsActive bỏ trống = true (nhà cung cấp mới mặc định đang hợp
          tác).
        type: boolean
      name:
        maxLength: 150
        type: string
      note:
        maxLength: 500
        type: string
      phone:
        maxLength: 20
        type: string
      tax_code:
        maxLength: 30
        type: string
    required:
    - name
    type: object
  dto.TaoChinhThucRequest:
    properties:
      dien_thoai:
        example: "0901234567"
        maxLength: 20
        type: string
      email_lien_he:
        description: |-
          EmailLienHe là email THẬT của khách, để liên lạc. Khác hẳn `users.email`
          nói ở trên — chép cái .local tự sinh sang đây thì sổ khách hàng đầy những
          địa chỉ không gửi thư tới được, mà nhìn vẫn như email thật.
        example: huy@quochuy.vn
        maxLength: 150
        type: string
      ghi_chu:
        description: GhiChu vào chính hợp đồng — thoả thuận riêng, ai giới thiệu,
          hẹn gọi lại.
        example: khách anh Sơn giới thiệu
        maxLength: 500
        type: string
      ho_ten:
        description: |-
          HoTen của người quản trị. Bỏ trống thì lấy theo `nguoi_lien_he`, không có
          nữa thì "Quản trị viên" — hai ô đó gần như luôn là một người.
        example: Nguyễn Quốc Huy
        maxLength: 150
        type: string
      ma_cua_hang:
        description: |-
          MaCuaHang là ô ĐẦU TIÊN của màn hình đăng nhập 3 ô. Chuẩn hoá về chữ thường
          ở máy chủ — khách gõ lại ô này trên điện thoại, nơi bàn phím tự viết hoa.
        example: quochuy
        type: string
      mat_khau:
        description: MatKhau là ô THỨ BA. Tối thiểu 6 ký tự, khớp ràng buộc của UserRequest.
        example: MatKhau@123
        minLength: 6
        type: string
      nguoi_lien_he:
        description: |-
          Ba ô liên hệ ghi vào SỔ KHÁCH HÀNG (control plane), KHÔNG vào tài khoản
          đăng nhập: đây là người mình gọi khi hết hạn dùng thử, và họ thường không
          phải người ngồi gõ phần mềm.
        example: Anh Huy
        maxLength: 150
        type: string
      plan_id:
        description: |-
          PlanID lấy từ GET /platform/plans. Phần mềm suy ra từ chính dòng này, nên
          không có tham số `app` — gửi cả hai thì chúng mâu thuẫn được với nhau.
        example: 2
        type: integer
      so_thang:
        description: |-
          SoThang bỏ trống = một chu kỳ của gói (1 tháng, hoặc 12 nếu gói theo năm)
          — con số người ta muốn trong hầu hết trường hợp, nên không bắt gõ lại.
        example: 12
        maximum: 60
        minimum: 1
        type: integer
      ten_cua_hang:
        description: TenCuaHang hiển thị trong khu điều hành và làm tên chi nhánh
          mặc định.
        example: Cửa hàng Quốc Huy
        maxLength: 150
        type: string
      ten_dang_nhap:
        description: TenDangNhap là ô THỨ HAI của màn hình đăng nhập.
        example: admin
        type: string
    required:
    - ma_cua_hang
    - mat_khau
    - plan_id
    - ten_cua_hang
    - ten_dang_nhap
    type: object
  dto.TaoDungThuRequest:
    properties:
      dien_thoai:
        example: "0901234567"
        maxLength: 20
        type: string
      email_lien_he:
        description: |-
          EmailLienHe là email THẬT của khách, để liên lạc. Khác hẳn `users.email`
          nói ở trên — chép cái .local tự sinh sang đây thì sổ khách hàng đầy những
          địa chỉ không gửi thư tới được, mà nhìn vẫn như email thật.
        example: huy@quochuy.vn
        maxLength: 150
        type: string
      ghi_chu:
        description: GhiChu vào chính hợp đồng — thoả thuận riêng, ai giới thiệu,
          hẹn gọi lại.
        example: khách anh Sơn giới thiệu
        maxLength: 500
        type: string
      ho_ten:
        description: |-
          HoTen của người quản trị. Bỏ trống thì lấy theo `nguoi_lien_he`, không có
          nữa thì "Quản trị viên" — hai ô đó gần như luôn là một người.
        example: Nguyễn Quốc Huy
        maxLength: 150
        type: string
      ma_cua_hang:
        description: |-
          MaCuaHang là ô ĐẦU TIÊN của màn hình đăng nhập 3 ô. Chuẩn hoá về chữ thường
          ở máy chủ — khách gõ lại ô này trên điện thoại, nơi bàn phím tự viết hoa.
        example: quochuy
        type: string
      mat_khau:
        description: MatKhau là ô THỨ BA. Tối thiểu 6 ký tự, khớp ràng buộc của UserRequest.
        example: MatKhau@123
        minLength: 6
        type: string
      nguoi_lien_he:
        description: |-
          Ba ô liên hệ ghi vào SỔ KHÁCH HÀNG (control plane), KHÔNG vào tài khoản
          đăng nhập: đây là người mình gọi khi hết hạn dùng thử, và họ thường không
          phải người ngồi gõ phần mềm.
        example: Anh Huy
        maxLength: 150
        type: string
      plan_id:
        description: |-
          PlanID lấy từ GET /platform/plans. Phần mềm suy ra từ chính dòng này, nên
          không có tham số `app` — gửi cả hai thì chúng mâu thuẫn được với nhau.
        example: 2
        type: integer
      so_ngay_dung_thu:
        description: |-
          SoNgayDungThu bỏ trống (null) = lấy `trial_days` của dòng bảng giá. Gửi số
          là ghi đè cho riêng khách này. Gửi 0 bị từ chối: "dùng thử 0 ngày" tạo ra
          một hợp đồng quá hạn ngay từ giây đầu.
        example: 14
        type: integer
      ten_cua_hang:
        description: TenCuaHang hiển thị trong khu điều hành và làm tên chi nhánh
          mặc định.
        example: Cửa hàng Quốc Huy
        maxLength: 150
        type: string
      ten_dang_nhap:
        description: TenDangNhap là ô THỨ HAI của màn hình đăng nhập.
        example: admin
        type: string
    required:
    - ma_cua_hang
    - mat_khau
    - plan_id
    - ten_cua_hang
    - ten_dang_nhap
    type: object
  dto.TaoDungThuResponse:
    properties:
      goi:
        example: Cửa hàng
        type: string
      het_han:
        description: |-
          HetHan cũng chính là ngày hết dùng thử: hạn hợp đồng thử KHÔNG đẩy ra xa
          hơn ngày đó.
        type: string
      hop_dong_id:
        example: 12
        type: integer
      ma_cua_hang:
        example: quochuy
        type: string
      nguon_dieu_khoan:
        additionalProperties:
          type: string
        type: object
      ten_cua_hang:
        example: Cửa hàng Quốc Huy
        type: string
      ten_dang_nhap:
        example: admin
        type: string
      tenant_id:
        example: 7
        type: integer
      trang_thai:
        description: |-
          TrangThai của hợp đồng vừa ghi: `trial` hay `active`. Có mặt vì cùng một
          kiểu này phục vụ CẢ HAI đường tạo khách — nơi hiển thị đọc nó để biết vừa
          mở một kỳ dùng thử hay vừa bán một hợp đồng.
        example: trial
        type: string
    type: object
  dto.ThuTienRequest:
    properties:
      ghi_chu:
        maxLength: 500
        type: string
      hinh_thuc:
        description: 'HinhThuc: chuyen_khoan | tien_mat | khac. Bỏ trống = chuyen_khoan.'
        enum:
        - chuyen_khoan
        - tien_mat
        - khac
        example: chuyen_khoan
        type: string
      ky_den:
        example: "2027-08-14"
        type: string
      ky_tu:
        description: |-
          KyTu / KyDen dạng 2006-01-02, bỏ trống = MÁY CHỦ TỰ TÍNH: từ điểm cuối của
          kỳ đã trả gần nhất (hoặc ngày bắt đầu hợp đồng nếu chưa trả lần nào) tới
          hạn hiện tại. Nhờ vậy hai lần thu liên tiếp không chồng lấn và cũng không
          để hở khoảng nào ở giữa.

          Chỉ khai tay khi thu cho một kỳ KHÁC với kỳ máy chủ tính ra.
        example: "2026-08-14"
        type: string
      ma_giao_dich:
        description: |-
          MaGiaoDich là mã giao dịch ngân hàng hoặc số phiếu thu — thứ dùng để đối
          chiếu với sao kê. Không bắt buộc, nhưng thiếu nó thì lần thu này không tra
          ngược lại được từ sổ ngân hàng.
        example: FT26081412345
        maxLength: 100
        type: string
      so_tien:
        description: |-
          SoTien bỏ trống (0) = lấy ĐÚNG GIÁ HỢP ĐỒNG. Khai số khác khi thu thiếu,
          thu gộp, hoặc có chiết khấu một lần — số ở đây là tiền THẬT đã nhận, và
          nó được phép khác giá đã ký.
        example: 990000
        minimum: 0
        type: number
    type: object
  dto.ThuTienResponse:
    properties:
      hinh_thuc:
        example: chuyen_khoan
        type: string
      ky_den:
        type: string
      ky_tu:
        type: string
      so_lan_thu:
        example: 2
        type: integer
      so_tien:
        example: 990000
        type: number
      tong_da_thu:
        description: |-
          TongDaThu là tổng tiền đã thu của hợp đồng này SAU lần ghi vừa rồi — để
          màn hình khỏi phải gọi thêm một lượt chỉ để cập nhật một con số.
        example: 1980000
        type: number
    type: object
  dto.UpdateContactStatusRequest:
    properties:
      admin_note:
        maxLength: 500
        type: string
      status:
        enum:
        - moi
        - dang-xu-ly
        - da-xong
        type: string
    required:
    - status
    type: object
  dto.UserPasswordRequest:
