        example: 3
        type: integer
      theo_quan:
        items:
          $ref: '#/definitions/dto.DoanhThuItem'
        type: array
      tong_tien:
        example: 29970000
        type: number
    type: object
  dto.DoiMatKhauRequest:
    properties:
      mat_khau:
        example: MatKhauMoi@123
        maxLength: 100
        minLength: 6
        type: string
    required:
    - mat_khau
    type: object
  dto.DonGiaHanResponse:
    properties:
      checkout_url:
        description: |-
          CheckoutURL là trang trả tiền của cổng — đường LUI, cho khách muốn trả
          bằng ví điện tử hoặc thẻ. Trang thanh toán của mình tự dựng được màn hình
          chuyển khoản từ năm trường ngay dưới, nên khách không bắt buộc phải rời
          phần mềm.
        type: string
      chu_tai_khoan:
        type: string
      da_tra:
        description: |-
          DaTra là bản rút gọn của TrangThai cho màn hình khỏi so chuỗi — nó quyết
          định trang thanh toán hiện "đang chờ" hay "đã gia hạn".
        example: false
        type: boolean
      dien_thoai:
        example: "0901234567"
        type: string
      email:
        example: huy@quochuy.vn
        type: string
      han_moi:
        description: |-
          HanMoi là hạn hợp đồng SAU khi đã gia hạn — chỉ có nghĩa khi DaTra = true.
          Đây là câu trả lời khách chờ nghe nhất sau khi trả tiền.
        type: string
      het_han_luc:
        type: string
      id:
        example: 12
        type: integer
      ma_cua_hang:
        example: order1
        type: string
      ma_don:
        example: 12
        type: integer
      ngan_hang_bin:
        description: |-
          Bốn ô dưới là bản CHỮ của chính mã QR, cho khách không quét được (máy bàn,
          app ngân hàng cũ) vẫn chuyển tay đúng.
        example: "970422"
        type: string
      nguoi_lien_he:
        example: Nguyễn Quốc Huy
        type: string
      noi_dung:
        description: |-
          NoiDung là nội dung chuyển khoản — thứ duy nhất nối một lần tiền vào với
          một đơn. Gõ sai thì tiền vào tài khoản mà không đơn nào được chốt.
        type: string
      qr_code:
        description: QRCode là chuỗi VietQR nguyên văn — màn hình tự vẽ mã QR từ nó.
        type: string
      so_tai_khoan:
        type: string
      so_thang:
        example: 3
        type: integer
      so_tien:
        example: 1497000
        type: number
      ten_app:
        description: |-
          ----- BÊN MUA: cửa hàng đang trả tiền -----

          Có mặt vì một trang thanh toán phải nói rõ ĐANG THU TIỀN CHO AI. Không có
          nó, người bấm trả tiền trên một máy dùng chung không có cách nào chắc mình
          đang gia hạn đúng cửa hàng của mình — và tiền đã chuyển thì không rút lại
          được.

          Ba ô liên hệ lấy từ SỔ KHÁCH HÀNG của nền tảng, tức đúng thứ sẽ in trên hoá
          đơn. Sai thì khách sửa được bằng cách gọi cho nhà cung cấp — nên hiện ra là
          để họ phát hiện, không phải để trang trí.
        example: Sellio Order
        type: string
      ten_cua_hang:
        example: Quốc Huy
        type: string
      ten_goi:
        description: |-
          TenGoi là gói của HỢP ĐỒNG hiện tại, để màn hình nhắc lại khách đang gia hạn
          cái gì.
        example: Cửa hàng
        type: string
      trang_thai:
        description: 'TrangThai: cho_thanh_toan | da_thanh_toan | huy | het_han'
        example: cho_thanh_toan
        type: string
    type: object
  dto.FacebookLoginRequest:
    properties:
      code:
        type: string
      redirect_uri:
        description: |-
          RedirectURI phải TRÙNG TỪNG KÝ TỰ với cái đã dùng lúc mở hộp thoại đăng nhập,
          nếu không Facebook từ chối đổi code.
        type: string
    required:
    - code
    - redirect_uri
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.GiaHanRequest:
    properties:
      so_thang:
        description: |-
          SoThang cộng vào GREATEST(ends_at, NOW()), không phải vào ends_at: hợp đồng
          đã quá hạn ba tháng mà cộng dồn từ ngày cũ thì khách trả tiền xong vẫn còn
          quá hạn.
        example: 12
        maximum: 60
        minimum: 1
        type: integer
    required:
    - so_thang
    type: object
  dto.GoiDichVuCuaToiResponse:
    properties:
      bang_gia:
        items:
          $ref: '#/definitions/dto.PlanItem'
        type: array
      da_dung:
        allOf:
        - $ref: '#/definitions/dto.DaDungHanMuc'
        description: |-
          DaDung nil = chưa có hợp đồng để so, hoặc lượt đếm vừa hỏng. Màn hình rơi
