  /platform/chinh-thuc:
    post:
      consumes:
      - application/json
      description: |-
        Dựng TRỌN GÓI một khách hàng mới — cửa hàng + chi nhánh mặc định + tài
        khoản quản trị (data plane) + hợp đồng (control plane) — y hệt
        POST /platform/dung-thu, khác đúng một chỗ: hợp đồng ra `active` ngay và
        KHÔNG có giai đoạn dùng thử. Thời hạn tính bằng THÁNG.
        `so_thang` bỏ trống = một chu kỳ của gói (1 tháng, hoặc 12 nếu gói theo năm).
        Giá và ba hạn mức CHÉP từ bảng giá lúc ký rồi sống độc lập — không có ô
        nào khai tay. Bảng giá thiếu hạn mức thì lượt tạo bị TỪ CHỐI (422).
        Việc này KHÔNG ghi tiền vào sổ thu; thu tiền là đường riêng.
      parameters:
