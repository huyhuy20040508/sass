        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Tạo đơn hàng thủ công
      tags:
      - Admin - Orders
