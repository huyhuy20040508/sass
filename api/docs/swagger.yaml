      slug:
        maxLength: 191
        type: string
    required:
    - quantity
    type: object
  dto.CheckoutPayment:
    properties:
      account_name:
        type: string
      account_number:
        type: string
      amount:
        type: number
      bank_name:
        description: |-
          Ba trường tài khoản dưới đây chỉ có ở SePay — khách quét QR thì không cần,
          nhưng ai muốn chuyển tay vẫn phải có chỗ đọc số tài khoản.
        type: string
      checkout_url:
        description: |-
          CheckoutURL là trang thanh toán của cổng — chỉ PayOS có. Dành cho khách dùng
          điện thoại, không tự quét màn hình của chính mình được.
        type: string
      content:
        description: Content là nội dung chuyển khoản khách phải ghi. Luôn là mã đơn.
        type: string
      expires_at:
        description: |-
          ExpiresAt là mốc mã hết hiệu lực (RFC3339), rỗng nếu không đặt hạn — mã của
          SePay không hết hạn vì nó chỉ là một lệnh chuyển tiền dựng sẵn.
        type: string
      provider:
        description: 'Provider: payos | sepay.'
        type: string
      qr_code:
        description: QRCode là chuỗi VietQR thô — dành cho client muốn tự vẽ mã theo
          kiểu của mình.
        type: string
      qr_image:
        description: |-
          QRImage là ảnh mã QR để trang web gán thẳng vào thẻ <img>. Với PayOS đây là
          ảnh PNG dạng data URI do API tự vẽ; với SePay là địa chỉ ảnh trên qr.sepay.vn.
        type: string
      transaction_code:
        description: |-
          TransactionCode là mã giao dịch phía cổng — cũng là mã dùng để hỏi
          `GET /payments/{code}`. Với SePay nó chính là mã đơn (và là nội dung khách
          phải ghi khi chuyển khoản); với PayOS nó là một con số riêng, khác mã đơn.
        type: string
    type: object
  dto.CheckoutRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CheckoutItemRequest'
        maxItems: 50
        minItems: 1
        type: array
      note:
        maxLength: 500
        type: string
      payment_method:
        enum:
        - cod
        - bank_transfer
        - payos
        - sepay
        type: string
      recipient_email:
        maxLength: 100
        type: string
      recipient_name:
        maxLength: 100
        type: string
      recipient_phone:
        maxLength: 20
        type: string
      shipping_address:
        maxLength: 255
        type: string
      shipping_district:
        maxLength: 100
        type: string
      shipping_province:
        maxLength: 100
        type: string
      shipping_ward:
        maxLength: 100
        type: string
      voucher_code:
        description: |-
          VoucherCode là mã giảm giá khách gõ tay, để trống là không dùng mã. Mức giảm
          được API TỰ TÍNH LẠI trên giá tại thời điểm đặt — client không gửi số tiền
          giảm lên, và có gửi cũng không được dùng.
        example: SALE10
        maxLength: 50
        type: string
    required:
    - items
    - payment_method
    - recipient_name
    - recipient_phone
    - shipping_address
    type: object
  dto.CheckoutResponse:
    properties:
      bank_transfer:
        allOf:
        - $ref: '#/definitions/dto.CheckoutBankTransfer'
        description: |-
          BankTransfer chỉ có ở đơn chuyển khoản: mọi thứ khách cần để mở app ngân
          hàng lên chuyển tiền. Tách thành trường riêng thay vì nhồi hết vào `message`
          để client dựng được khối có nút sao chép, và `message` không thành một đoạn
          dài nói lại đúng những gì bên dưới đã hiện.
      discount_amount:
        description: Discount / VoucherCode là 0 và rỗng khi khách không dùng mã.
        type: number
      message:
        type: string
      order_code:
        type: string
      order_id:
        type: integer
      payment:
        allOf:
        - $ref: '#/definitions/dto.CheckoutPayment'
        description: |-
          Payment chỉ có ở đơn thanh toán online (payos / sepay): mọi thứ khách cần để
          trả tiền ngay. Vắng mặt nghĩa là không mở được cổng — đơn vẫn hợp lệ, chỉ là
          chưa trả tiền được và `message` nói rõ phải làm gì tiếp.
      payment_method:
        type: string
      shipping_fee:
        type: number
      status:
        type: string
      subtotal_amount:
        type: number
      total_amount:
        type: number
      voucher_code:
        type: string
    type: object
  dto.ChiNhanhRequest:
    properties:
      address:
        maxLength: 255
        type: string
      code:
        description: |-
          Code bỏ trống khi TẠO = hệ thống tự sinh (chi-nhanh-2, chi-nhanh-3…). Bỏ
          trống khi SỬA = giữ nguyên mã cũ: mã đã đi vào chứng từ, tự đổi là hồ sơ
          hai bên lệch nhau.
        example: kho-mien-bac
        maxLength: 30
        type: string
      is_active:
        description: IsActive bỏ trống = true (chi nhánh mới mặc định đang hoạt động).
        type: boolean
      name:
        example: Kho miền Bắc
        maxLength: 150
        type: string
      phone:
        description: Phone/Address bỏ trống ghi xuống NULL, không phải chuỗi rỗng.
        example: "0912345678"
        maxLength: 20
        type: string
    required:
    - name
    type: object
  dto.ContactRequestResponse:
    properties:
      address:
        type: string
      admin_note:
        type: string
      content:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      handled_at:
        type: string
      handler_name:
