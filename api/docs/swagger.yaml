        Khoá lạ hoặc giá trị sai kiểu làm cả yêu cầu bị từ chối (422), không ghi
        xuống một phần. Trả về gói sau khi ghi.
        CHỈ vai trò owner/operator của khu điều hành ghi được; support chỉ đọc.
        Sửa ở đây KHÔNG đụng tới khách đang dùng: thuê bao đã ký chép hạn mức ra
