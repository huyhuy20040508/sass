  /admin/vouchers:
    get:
      description: |-
        Mã giảm giá khách tự nhập lúc thanh toán, giảm trên TỔNG ĐƠN (khác `promotions` — giảm tự động trên từng sản phẩm).
        `status` của mỗi dòng được suy ra từ ngày hiệu lực + lượt đã dùng + trạng thái bật tắt: running | scheduled | ended | used_up | paused.
      parameters:
      - description: Tìm theo mã hoặc mô tả
        in: query
        name: keyword
        type: string
      - description: all | running | scheduled | ended | used_up | paused
        in: query
        name: status
        type: string
      - description: percentage | fixed
        in: query
        name: type
        type: string
      - description: Từ ngày (YYYY-MM-DD) — mã có hiệu lực trong khoảng
        in: query
        name: from_date
        type: string
      - description: Đến ngày (YYYY-MM-DD)
        in: query
        name: to_date
        type: string
      - description: newest|oldest|code_asc|used_desc|end_asc
        in: query
        name: sort
        type: string
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số item/trang (mặc định 20, tối đa 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.VoucherResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Danh sách voucher
      tags:
      - Admin - Vouchers
    post:
      consumes:
      - application/json
      description: |-
        Mã được chuẩn hoá về CHỮ HOA trước khi lưu — khách gõ "sale10" vẫn trúng mã "SALE10".
        `start_at` / `end_at` để trống là không giới hạn phía đó: mã dùng được ngay, hoặc dùng mãi tới khi bị tắt.
      parameters:
      - description: Dữ liệu voucher
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.VoucherRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.VoucherResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Mã đã tồn tại
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Mã sai định dạng, sai thời gian hiệu lực, hoặc sai % giảm
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Tạo voucher
      tags:
      - Admin - Vouchers
  /admin/vouchers/{id}:
    delete:
