        Kèm sẵn số liệu mua hàng để trang quản lý không phải gọi thêm: `purchase_amount` (tổng giá trị đã đặt), `debt_amount` (còn nợ), `last_order_at` (lần đặt gần nhất) — cả ba KHÔNG tính phiếu nháp và phiếu đã huỷ.
