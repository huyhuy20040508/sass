          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Hợp đồng đã ký
      tags:
      - Platform - Khách hàng
  /platform/subscriptions/{id}:
    get:
      description: |-
        Trọn hợp đồng kèm hồ sơ khách đứng sau nó: điều khoản đã chốt, hai mốc
        của kỳ dùng thử, ghi chú hợp đồng và ghi chú khách, ngày vào sổ.
        `sua_duoc_han` nói màn hình có được hiện ô đổi ngày hết hạn không —
        luật do máy chủ quyết, giao diện chỉ đọc cờ.
        Chỉ phần mềm người gọi được phụ trách.
      parameters:
      - description: ID hợp đồng
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.HopDongChiTietResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Chi tiết một hợp đồng
      tags:
      - Platform - Khách hàng
    put:
      consumes:
      - application/json
      description: |-
        Sửa THÔNG TIN, không sửa ĐIỀU KHOẢN. Gói, chu kỳ, giá và ba hạn mức
        không có ô nào ở đây: chúng đã chốt lúc ký và cả hệ thống dựng trên
        nguyên tắc chúng không đổi. Bán thêm quyền lợi cho một khách vẫn là việc
        của `cmd/thue-bao`.
        `het_han` chỉ nhận khi hợp đồng đang dùng thử — hạn của kỳ thử là quyết
        định bán hàng, còn hạn của hợp đồng đã trả tiền thì đi đường Gia hạn để
        đường tiền và đường hạn không tách nhau. Bỏ trống = giữ nguyên.
        Hợp đồng đã huỷ không sửa được: đó là bản ghi lịch sử.
      parameters:
      - description: ID hợp đồng
        in: path
        name: id
        required: true
        type: integer
      - description: Thông tin khách và ghi chú
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SuaHopDongRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.HopDongChiTietResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Sửa thông tin khách và ghi chú của hợp đồng
      tags:
      - Platform - Khách hàng
  /platform/subscriptions/{id}/doi-mat-khau:
    post:
      consumes:
      - application/json
      description: |-
        Đặt lại mật khẩu cho tài khoản quản trị (super_admin cũ nhất) của cửa
        hàng đứng sau hợp đồng này.
        Có đường này vì tài khoản quản trị cửa hàng KHÔNG có cách tự khôi phục:
        quên-mật-khẩu-qua-email chỉ tồn tại trong cụm storefront dành cho khách
        mua sắm. Khách quên mật khẩu thì gọi nhà cung cấp, và đây là chỗ nhà cung
        cấp làm được việc đó.
        CHỈ đổi mật khẩu — tài khoản đang bị khoá thì vẫn khoá sau khi đổi.
        Câu trả lời kèm tên đăng nhập để đọc lại cho khách nghe.
      parameters:
      - description: ID hợp đồng
        in: path
        name: id
        required: true
        type: integer
      - description: Mật khẩu mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DoiMatKhauRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.QuanTriItem'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Đặt lại mật khẩu tài khoản quản trị của khách
      tags:
      - Platform - Khách hàng
  /platform/subscriptions/{id}/gia-han:
    post:
      consumes:
      - application/json
      description: |-
        Đẩy hạn thêm `so_thang` tháng tính từ GREATEST(ngày hết hạn, hôm nay) —
        hợp đồng đã quá hạn ba tháng mà cộng dồn từ ngày cũ thì khách trả tiền
        xong vẫn còn quá hạn.
        Trạng thái chuyển sang `active` và mốc hết dùng thử bị xoá, nên gọi trên
        một hợp đồng `trial` CHÍNH LÀ chuyển khách sang chính thức. Không có
        endpoint riêng cho việc đó: hai việc là một.
        KHÔNG ghi vào sổ thu — tiền vào là `cmd/thue-bao thu-tien`, việc khác.
      parameters:
      - description: ID hợp đồng
        in: path
        name: id
        required: true
        type: integer
      - description: Số tháng gia hạn
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.GiaHanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.HopDongMotItem'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Gia hạn hợp đồng (cũng là chuyển dùng thử sang chính thức)
      tags:
      - Platform - Khách hàng
  /platform/subscriptions/{id}/huy:
    post:
      consumes:
      - application/json
      description: |-
        Đóng hợp đồng và nối lý do vào `note` — KHÔNG xoá dòng: khách cũ vẫn phải
        tra được mình đã dùng gì, và báo cáo doanh thu của những tháng đã qua vẫn
        phải đứng nguyên.
        Huỷ xong là khoá "mỗi khách mỗi phần mềm một hợp đồng" được nhả ra, nên
        đây cũng là bước bắt buộc trước khi ký lại cho khách đổi gói.
      parameters:
      - description: ID hợp đồng
        in: path
        name: id
        required: true
        type: integer
      - description: Lý do huỷ
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.HuyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Huỷ hợp đồng
      tags:
      - Platform - Khách hàng
  /platform/subscriptions/{id}/thu-tien:
    post:
      consumes:
      - application/json
      description: |-
        Ghi MỘT LẦN TIỀN VÀO sổ thu, KHÔNG đẩy hạn hợp đồng. Hai việc đó cố ý
        tách rời: gộp lại thì mỗi lần gia hạn báo một khoản doanh thu chưa ai
        trả, và khách trả trước mà chưa muốn đẩy hạn thì không ghi vào đâu được.
        Chu kỳ bỏ trống thì máy chủ tự tính: từ điểm cuối của kỳ đã trả gần nhất
        (hoặc ngày bắt đầu hợp đồng) tới hạn hiện tại — nhờ vậy hai lần thu liên
        tiếp không chồng lấn và cũng không để hở khoảng nào.
        Số tiền bỏ trống = giá đã ký của hợp đồng.
        Một hợp đồng · một chu kỳ · một lần thu (409 nếu ghi trùng kỳ).
      parameters:
      - description: ID hợp đồng
        in: path
        name: id
        required: true
        type: integer
      - description: Số tiền, hình thức, chu kỳ
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ThuTienRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.ThuTienResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Ghi nhận một lần tiền vào
      tags:
      - Platform - Khách hàng
  /platform/tenants:
    get:
      description: |-
        Chỉ khách CÓ hợp đồng: quan hệ "khách của phần mềm này" tồn tại qua hợp
        đồng, không qua bảng khách hàng. Mặc định bỏ hợp đồng đã huỷ — muốn xem
        khách cũ thì lọc `?trang_thai=canceled`.
        Chỉ phần mềm người gọi được phụ trách (owner thấy hết).
      parameters:
      - description: Mã phần mềm; bỏ trống = mọi phần mềm được giao
        in: query
        name: app
        type: string
      - description: trial | active | past_due | canceled
        in: query
        name: trang_thai
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.KhachHangResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Khách hàng của một phần mềm
      tags:
      - Platform - Khách hàng
  /platform/webhook/payos:
    post:
      consumes:
      - application/json
      description: |-
        PayOS gọi vào đây khi một đơn gia hạn được trả tiền. KHÔNG có token: thứ
        chứng minh gói dữ liệu đến từ PayOS là chữ ký HMAC-SHA256 tính trên chính
        body — sai chữ ký thì từ chối thẳng.
        Tiền vào ĐỦ số của đơn thì hợp đồng được đẩy hạn và cửa hàng mở khoá ngay.
        Trả thiếu thì chỉ ghi nhật ký để người bán đối soát tay, KHÔNG tự gia hạn.
        Mã đơn lạ (của hệ thống khác dùng chung kênh) vẫn trả 200 kèm log — trả lỗi
        chỉ khiến PayOS gửi lại gói đó suốt nhiều giờ.
      produces:
      - application/json
      responses:
        "200":
          description: Đã nhận (hoặc đã bỏ qua)
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Không đọc được dữ liệu
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Chữ ký không hợp lệ
          schema:
            $ref: '#/definitions/response.Body'
      summary: Webhook PayOS báo tiền gia hạn đã vào (công khai)
      tags:
      - Platform - Gia hạn
  /products:
    get:
      description: |-
        Lọc theo từ khóa, danh mục, thương hiệu, loại áo, khoảng giá; hỗ trợ phân trang & sắp xếp.
        `cost_price` (giá vốn, ở cả sản phẩm lẫn biến thể) CHỈ trả về khi gọi kèm token của nhân viên quản trị; các trường hợp khác luôn là null.
      parameters:
      - description: Tìm theo tên/đội/SKU
        in: query
        name: keyword
        type: string
      - description: ID danh mục (tự gộp sản phẩm của mọi danh mục con/cháu)
        in: query
        name: category_id
        type: integer
      - description: ID thương hiệu
        in: query
        name: brand_id
        type: integer
      - description: 'Loại áo: fan (FAN) | player (PLAYER)'
        in: query
        name: kit_type
        type: string
      - description: Giá tối thiểu
        in: query
        name: min_price
        type: number
      - description: Giá tối đa
        in: query
        name: max_price
        type: number
      - description: Chỉ sản phẩm nổi bật
        in: query
        name: featured
        type: boolean
      - description: Chỉ sản phẩm đang giảm giá
        in: query
        name: on_sale
        type: boolean
      - description: Lọc theo cờ hiển thị (true=đang bán, false=không hiện)
        in: query
        name: active
        type: boolean
      - description: 'Lọc theo trạng thái kinh doanh: active | hidden | discontinued'
        in: query
        name: status
        type: string
      - description: true = admin lấy cả sản phẩm đã ẩn
        in: query
        name: all
        type: boolean
      - description: true = không trả kèm biến thể & thư viện ảnh (nhẹ hơn nhiều cho
          trang danh sách)
        in: query
        name: slim
        type: boolean
      - description: newest|price_asc|price_desc|best_selling
        in: query
        name: sort
        type: string
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số item/trang (mặc định 20, tối đa 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Danh sách sản phẩm
      tags:
      - Products
  /products/{slug}:
    get:
      description: |-
        Lấy chi tiết sản phẩm theo slug (kèm biến thể, ảnh) và tăng lượt xem.
        `cost_price` (giá vốn) CHỈ trả về khi gọi kèm token của nhân viên quản trị; các trường hợp khác luôn là null.
      parameters:
      - description: Slug sản phẩm
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      summary: Chi tiết sản phẩm
      tags:
      - Products
  /public/orders/lookup:
    get:
      consumes:
      - application/json
      description: Tra cứu tình trạng đơn theo mã đơn (order_code) cho khách hàng
        ở storefront — không cần đăng nhập. Trả về đơn kèm danh sách sản phẩm, đã
        ẩn ghi chú nội bộ.
      parameters:
      - description: 'Mã đơn hàng (VD: DH-2026-000123)'
        in: query
        name: order_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/domain.Order'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      summary: Tra cứu đơn hàng (công khai)
      tags:
      - Orders
  /returns/me:
    get:
      consumes:
      - application/json
      description: Danh sách phiếu trả của CHÍNH tài khoản đang đăng nhập, mới nhất
        trước. Id tài khoản lấy từ access token, không nhận `user_id` từ client. Ghi
        chú nội bộ của cửa hàng được ẩn khỏi kết quả.
      parameters:
      - description: 'Lọc trạng thái: all|pending|approved|received|refunded|rejected|cancelled
          — nhiều giá trị ngăn cách bởi dấu phẩy'
        in: query
        name: status
        type: string
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số phiếu/trang (mặc định 10, tối đa 50)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                meta:
                  $ref: '#/definitions/response.Pagination'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Phiếu trả hàng của tôi (khách đã đăng nhập)
      tags:
      - Returns
    post:
      consumes:
      - application/json
      description: |-
        Khách chọn món cần trả trong đơn của CHÍNH mình, nêu lý do và cách nhận tiền hoàn. Phiếu tạo ra ở trạng thái "chờ duyệt" và nhân viên sẽ xử lý.
        Chỉ gửi được cho đơn ĐÃ GIAO / HOÀN TẤT và trong vòng 7 ngày kể từ ngày nhận hàng; quá hạn thì khách phải liên hệ cửa hàng (trả 409).
        Số lượng trả được đối chiếu với số CÒN trả được ngay dưới khoá dòng đơn nên không thể trả cùng một món hai lần qua hai yêu cầu. Giá do server chụp lại từ đơn gốc.
        Đơn không thuộc tài khoản đang đăng nhập trả 404 để không lộ đơn của người khác.
      parameters:
      - description: Nội dung yêu cầu trả hàng
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ReturnCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.ReturnDetail'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Đơn không nằm trong diện trả hàng hoặc đã quá hạn
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Gửi yêu cầu trả hàng (khách đã đăng nhập)
      tags:
      - Returns
  /returns/me/{id}:
    get:
      consumes:
      - application/json
      description: Phiếu kèm danh sách món trả, đơn gốc và lịch sử xử lý. Phiếu KHÔNG
        thuộc tài khoản đang đăng nhập trả về 404 để không lộ phiếu của người khác
        qua việc thử ID.
      parameters:
      - description: ID phiếu trả hàng
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.ReturnDetail'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Chi tiết phiếu trả hàng của tôi (khách đã đăng nhập)
      tags:
      - Returns
  /returns/me/{id}/cancel:
    post:
      consumes:
      - application/json
      description: |-
        Khách tự rút yêu cầu của CHÍNH mình. Chỉ rút được khi phiếu còn ở "chờ duyệt" — cửa hàng đã duyệt thì hàng có thể đang trên đường về kho nên phải liên hệ nhân viên (trả 422).
        Phiếu không thuộc tài khoản đang đăng nhập trả 404 để không lộ phiếu của người khác.
      parameters:
      - description: ID phiếu trả hàng
        in: path
        name: id
        required: true
        type: integer
      - description: Lý do rút (không bắt buộc)
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.ReturnCancelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.ReturnDetail'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Rút yêu cầu trả hàng (khách đã đăng nhập)
      tags:
      - Returns
  /settings:
    get:
      description: |-
        Chỉ các khoá được đánh dấu công khai (tên cửa hàng, liên hệ, phí vận
        chuyển) — storefront đọc để không phải chép lại cấu hình của server.
        Đọc từ snapshot trong bộ nhớ nên không tốn truy vấn database.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      summary: Cấu hình công khai
      tags:
      - Settings
  /vouchers/available:
    post:
      consumes:
      - application/json
      description: |-
        Danh sách mã ĐẠI TRÀ (`is_public = true`) còn hiệu lực, để hiện thẳng ở ô nhập mã cho khách bấm chọn thay vì phải nhớ và gõ tay.
        Mã gửi tay cho riêng một khách (`is_public = false`) KHÔNG bao giờ xuất hiện ở đây — chỉ ai biết mã mới gõ được.
        Mã chưa đạt đơn tối thiểu vẫn trả về, kèm `missing_amount` để giao diện nói rõ còn thiếu bao nhiêu. Mã khách đã dùng hết lượt riêng thì bị loại.
      parameters:
      - description: Tiền hàng của giỏ hiện tại
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.VoucherAvailableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.VoucherAvailableItem'
                  type: array
              type: object
      summary: Mã giảm giá gợi ý cho giỏ hàng (storefront)
      tags:
      - Storefront - Vouchers
  /vouchers/check:
    post:
      consumes:
      - application/json
      description: |-
        Khách gõ mã ở giỏ hàng để xem trước số tiền được giảm. Không tiêu lượt của mã — lượt chỉ bị tiêu khi đơn được tạo thật.
        Gửi kèm access token thì hạn mức "mỗi khách bao nhiêu lượt" được kiểm luôn; khách vãng lai không kiểm được phần đó.
        Con số trả về chỉ để hiển thị: lúc đặt hàng API tính lại trên giá tại thời điểm bấm đặt.
      parameters:
      - description: Mã và tiền hàng hiện tại
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.VoucherCheckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.VoucherCheckResponse'
              type: object
        "422":
          description: Mã không tồn tại, hết hạn, hết lượt, hoặc đơn chưa đạt tối
            thiểu
          schema:
            $ref: '#/definitions/response.Body'
      summary: Kiểm mã giảm giá (storefront)
      tags:
      - Storefront - Vouchers
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Xác thực JWT. Nhập theo định dạng: **Bearer {access_token}**'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
